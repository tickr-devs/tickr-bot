# Settings of the historical replay tool (python -m tickr.replay). Every result is SIMULATED.
# Read only by src/tickr/replay/; the trading bot never reads this file. See docs/replay.md.

[replay]
# Adverse slippage per simulated fill, percent of the fill price; read by replay/engine.py.
slippage_percent = 0.05
# Minimum adverse slippage per simulated fill, USD per share; read by replay/engine.py.
slippage_min_usd = 0.01
# Bars after an ENTER decision during which the simulated entry may fill; read by replay/engine.py.
entry_wait_bars = 1
# Decimal places for prices, R and percent in CSV and summary outputs; read by replay/report.py.
output_decimal_places = 4
# true = give the strategy a synthetic quote around each completed bar's close (bars carry no bid/ask); read by replay/engine.py.
synthesize_quote = true
# Synthetic quote spread (ask - bid), percent of the bar close; ask = close + spread/2, bid = close - spread/2; read by replay/engine.py.
synthetic_spread_percent = 0.10
# Minimum synthetic quote spread, USD; read by replay/engine.py.
synthetic_spread_min_usd = 0.02
# Bid and ask size of the synthetic quote, shares; read by replay/engine.py.
synthetic_quote_size_shares = 100
# Measured slippage file written by `python -m tickr.research slippage` (its slippage_summary.json), relative to this file's folder; when set, its measured stop slippage replaces slippage_percent; "" = use slippage_percent; read by replay/settings.py.
measured_slippage_file = ""
# Fewest measured stopped trades the selected measured slippage file must hold, else the replay refuses; count; read by replay/settings.py.
measured_slippage_min_trades = 20
