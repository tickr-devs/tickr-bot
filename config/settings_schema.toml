# Settings schema numbers that are product choices (backlog S1): per owner setting, the step an
# app form offers and, where an owner decision sets one, the largest value allowed (key
# `maximum`, same unit as the setting; none is set yet). One table per setting, named
# <owner>."<table.key>": owner `platform` = config/bot.toml, any other owner =
# strategies/<owner>/strategy.toml. On/off settings have no entry. Every shipped value sits on
# its step (tests/test_settings_schema.py). Read only by tickr.settings_schema (load); nothing
# at runtime reads it yet.

# Owner platform: config/bot.toml.

[platform."risk.max_daily_loss_usd"]
# Step of this setting in the app forms and the validator, USD; read by tickr.settings_schema.
