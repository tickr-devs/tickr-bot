# Aperture platform settings. Every key has a comment: what it is, its unit, who reads it.
# Strategy values live in strategies/<name>/strategy.toml. Secrets never live here: only the
# NAMES of the environment variables that hold them.

[run]
# Active environment; must be a table under [environments]; read by config.load and the trading gate.
environment = "sandbox"
# Runtime data folder (database, capture files, lock), relative to the repo root; read by runtime and store.
data_dir = "data"
# Seconds a database write waits for another connection's write lock before failing; read by the store.
database_busy_timeout_seconds = 5
# Daily verified database backup folder, relative to data_dir; one file per NY date, only the latest kept (spec 10); read by runtime.watch.
backups_dir = "backups"
# Closed sessions whose capture and decision folders `aperture maintain` leaves uncompressed (today is never touched);
# older finished days are gzipped in place; read by maintain.
maintain_keep_sessions = 20

[strategy]
# Active strategy name = folder under strategies/; its decisions may reach the safety layer.
active = "price-action-v1"
# Observer strategy names: they decide on the same data but never trade (empty in v1); read by runtime.
observers = []

[risk]
# Planned loss per trade in USD (owner 2026-11-07); read by the strategy for sizing and by safety for the check.
planned_loss_usd = 50
# Maximum notional per position in USD (owner 2026-10-31); read by safety.
position_notional_cap_usd = 2500
# Daily loss ceiling in USD: today's NET realized loss (wins offset losses) + open reservations + new planned loss (owner 2026-11-14); read by safety.
max_daily_loss_usd = 300
# Smallest daily-loss room a new trade is sized into, USD: near the ceiling a trade is sized down to the room left
# (owner 2026-11-14), but below this room entries stop and status says "daily ceiling" (a smaller trade is not worth
# its costs; owner confirmed 2026-11-14); read by runtime.entries (strategy loss budget and status).
min_daily_room_usd = 10
# Maximum simultaneous open positions (v1 supports 1); read by safety.
max_open_positions = 1
# Maximum quote age for any decision, seconds, end to end from provider time (owner 2026-10-15); read by safety and strategy input.
max_quote_age_seconds = 5
# Allowed lead of the provider clock over ours, seconds: a quote time up to this far ahead counts as age 0, further ahead = refuse; read by safety.
# Also the lead a bot status file's written_at may have over the watchdog's clock reading; read by runtime.watchdog.
max_clock_skew_seconds = 1
# Per-symbol pause after a loss (spec section 7, check 4; owner 2026-11-14): true = after a trade
# in a symbol closes at a loss today (New York date), no new entry in that symbol for the minutes
# below; false = off (the minutes are then not read but must still be at least 1); read by safety.
symbol_cooldown_after_loss_enabled = true
# Pause length in minutes from the losing trade's close; an entry exactly at the end is allowed (owner 2026-11-14); read by safety.
symbol_cooldown_minutes_after_loss = 30

[session]
# Market time zone for all session times; read by the calendar and the scheduler.
timezone = "America/New_York"
# Calendar file with standard hours and exceptions, relative to the repo root; read by the calendar.
calendar_file = "config/calendar/us-equity-2026.json"
# Last entry this many minutes before the regular close (15:45 ET on a normal day); read by safety.
last_entry_minutes_before_close = 15
# All positions closed this many minutes before the regular close (15:55 ET on a normal day); read by runtime.
flatten_minutes_before_close = 5
# Seconds after the flatten time before broker reads must show nothing of ours left (alert not-flat-after-flatten,
# day-end record); keep it above [orders] reconcile_interval_seconds; read by runtime.dayend.
flatten_grace_seconds = 120
# Seconds before the regular close (the calendar's early close on a half day) from which no closing MARKET order is sent
# until the next regular open: the trade keeps its broker stop, the engine sets the market-closed fence and the owner gets
# the flatten-after-close alert; keep it below the flatten-to-close time; read by engine.manual.close_refusal.
close_order_cutoff_seconds = 60
# Trade on half days: false = no trading on half days; read by safety.
half_days_enabled = false

[orders]
# Prefix of bot client order ids; read by orders and reconciliation to recognise own orders.
client_order_id_prefix = "ap-"
# Prefix of probe client order ids; leftovers with it block the bot start; read by runtime.
probe_client_order_id_prefix = "probe-"
# Maximum client order id length in characters (Webull US stock limit); read by orders.
client_order_id_max_length = 32
# Seconds between Detail polls of a working order; read by orders (must fit the request budget).
detail_poll_seconds = 3
# Extra attempts to place a rejected protective stop before exiting the position; read by protection.
stop_retry_attempts = 2
# Seconds between protective stop attempts; read by protection.
stop_retry_spacing_seconds = 3
# Detail reads per engine step (Sandbox Detail route: 30 per 60 s; one read every 3 s = 20 per minute); read by the engine.
detail_reads_per_step = 1
# Extra cancel attempts after Detail shows an order still working after a cancel; then an operator fence; read by the engine.
cancel_retry_attempts = 2
# Seconds after a cancel before a Detail read showing the order still working counts as "cancel did not take"; read by the engine.
cancel_retry_spacing_seconds = 6
# Seconds a needed cancel may keep being refused by our request budget (nothing sent) before an operator alert and an entry fence; read by the engine.
cancel_not_sent_alert_seconds = 30
# Seconds a position may lack a verified broker stop before the engine closes it; read by the engine.
max_unprotected_seconds = 30
# Seconds after a closing order's send attempt before, still not filled, it sets the
# exit-not-filled operator fence and alert (nothing is resent); read by the engine.
max_exit_seconds = 30
# Seconds a SIGTERM shutdown may spend cancelling entries and protecting fills before it gives
# up with an alert (below the supervisor's 90 s alert and launchd's 120 s cap); read by the engine loop.
shutdown_deadline_seconds = 60
# Seconds between reconciliation passes (positions + open orders); read by runtime. Also the
# least spacing of the engine's own open-orders reads while a stop is held after an unresolved
# replace (engine._replace_blocks).
reconcile_interval_seconds = 10
# Maximum age in seconds of the last broker read before entries are blocked; read by safety.
broker_read_max_age_seconds = 30
# Consecutive "order not found" Detail reads before an order with an unknown send outcome is
# treated as never created; read by the engine.
unknown_absent_reads = 3
# Least seconds between two journal rows proving a working stop still had nothing filled: an
# unchanged Detail read the engine already makes writes an `order-held` row once this long after
# the order's last such proof (never an extra broker read); read by the engine, and the rows by
# api.history (the MAE/MFE window).
stop_held_proof_seconds = 60
# Least seconds between two `reconcile-checked` journal rows that say the same thing: after a
# successful reconciliation the bot journals whether the broker agreed with its records when the
# answer changed or the last such row is at least this old (no extra broker read); read by the
# runtime, and the rows by api.cleanday (the clean-day verdict of GET /days).
reconcile_proof_seconds = 300
# Largest gap in seconds between two `reconcile-checked` rows (the last one before the regular open
# and the first one after the regular close count as its edges) that a date can have and still be
# clean: a longer stretch without a recorded reconciliation (bot down, hours of failed reads) makes
# the date unknown. Must be above reconcile_proof_seconds; read by api.cleanday (GET /days).
reconcile_max_gap_seconds = 900

[probe]
# Shares per probe order (owner 2026-11-14); read by the probe command.
quantity = 1
# Maximum share price in USD for a probe symbol; read by the probe command.
max_price_usd = 50
# Probe stop distance below the fill price, percent; read by the probe command.
stop_percent_below_fill = 2.0
# Maximum planned loss of a probe in USD; read by the probe command.
max_loss_usd = 5
# Earliest probe start, New York time HH:MM; read by the probe command.
window_start = "10:00"
# Latest probe start, New York time HH:MM; read by the probe command.
window_end = "15:30"
# Seconds to wait for the probe entry to fill before cancelling it; read by the probe command.
entry_wait_seconds = 60
# Seconds to hold a protected probe position before closing it; read by the probe command.
hold_seconds = 60
# Largest stop tightening in one probe-replace-stop, USD per share (new stop minus current stop); read by the probe-replace-stop command.
replace_max_move_usd = 0.50
# Seconds Detail of the stop is polled after a probe-replace-stop request, one read per detail_poll_seconds; read by the probe-replace-stop command.
replace_observe_seconds = 15
# Folder for the evidence of `python -m aperture.probes` (one sub-folder per New York date and run), relative to [run] data_dir; read by the probes.
evidence_dir = "probes"
# Processes `probes chart-limit` starts at once, count; each has its own Webull client and its own request budget; read by the probes.
chart_limit_processes = 2
# Bars requests each chart-limit process sends inside one bars route window, count; must be within the route limit, and all processes together must pass it (docs/webull-facts.md C2: 20 each against a limit of 30); read by the probes.
chart_limit_requests = 20
# Seconds between starting the chart-limit processes and their first request, so every process has built its Webull client by then; read by the probes.
chart_limit_start_delay_seconds = 20
# Bars reads `probes chart-client` makes next to the running bot, count; with chart_client_interval_seconds this is how long the bot is watched (20 x 30 s = 10 minutes, docs/webull-facts.md C1); read by the probes.
chart_client_reads = 20
# Seconds between two chart-client reads; keep 60 / this at or below half of [chart] requests_per_minute, so the API's own charts still fit in the chart's slice; read by the probes.
chart_client_interval_seconds = 30

[api]
# Local API bind address; loopback only; read by the api server.
host = "127.0.0.1"
# Local API port; read by the api server and the status screen.
port = 8766
# Host names the API answers to; requests whose Host (name:port) or Origin (http://name:port) is not one of these are refused (DNS rebinding / cross-site guard); read by the api server.
allowed_hosts = ["127.0.0.1", "localhost"]
# Host headers (name, or name:port when not 443) the remote port answers to: the name of the HTTPS proxy in front of it, such as `tailscale serve` on this Mac, e.g. "mac.tailnet-name.ts.net"; empty = remote access off (the remote port is not opened); read by the api server.
remote_hosts = []
# Second loopback port, for remote access only: every request on it must carry the paired bearer token whatever its Host, and `tailscale serve` points here, never at `port`; read by the api server.
remote_port = 8767
# File holding the SHA-256 (hex) of the paired phone's bearer token, relative to data_dir; written by `python -m aperture.api pair`, never the token itself; read by the api server.
remote_token_hash_file = "remote-token.sha256"
# Random bytes in a newly paired bearer token (URL-safe text is about 4/3 as long); read by `python -m aperture.api pair`.
remote_token_bytes = 32
# File where `pair` leaves the pairing link (it holds the token) for the owner to move to the phone, relative to data_dir; written 0600, never printed, deleted by the api server on the first request that presents the new token; read by `pair` and the api server.
remote_pairing_file = "remote-pairing-link"
# Status file the bot writes and the API serves, relative to data_dir; read by the bot's status writer and the api server.
status_file = "status.json"
# Account file the bot writes after each successful broker read of positions and open orders (reconciliation) and the API serves at GET /account, relative to data_dir; read by the bot's account writer and the api server.
account_file = "account.json"
# Account document older than this many seconds is shown as stale; keep it above [orders] reconcile_interval_seconds; read by the api server.
account_stale_seconds = 30
# Command folder, relative to data_dir; the API writes into <commands_dir>/inbox, the bot consumes from there; read by the api server and the bot.
commands_dir = "commands"
# Status older than this many seconds is shown as stale (bot may be down); read by the api server.
status_stale_seconds = 15
# Last broker read older than this many seconds is shown as a warning (entries are blocked only past [orders]
# broker_read_max_age_seconds); keep it above [orders] reconcile_interval_seconds and below broker_read_max_age_seconds;
# read by the api server and returned to clients at GET /settings.
broker_read_warn_seconds = 15
# Seconds between refreshes of the status page, also returned to clients as a polling hint; read by the api server and the status page.
poll_seconds = 3
# Largest accepted command request body in bytes; larger = refused; read by the api server.
max_request_body_bytes = 1024
# Maximum unconsumed commands waiting in the inbox; more = new commands refused; read by the api server.
max_pending_commands = 20
# A command older than this many seconds when the bot reads it is refused as expired, never executed late; read by the bot via read_commands.
command_max_age_seconds = 60
# How many of the latest processed commands the bot lists in status.json (recent_commands); read by the bot's status writer.
status_recent_commands = 10
# Seconds the API remembers an Idempotency-Key and the 202 answer it gave (a repeat returns that answer and queues
# nothing); must be above command_max_age_seconds; keys are kept under <commands_dir>/idempotency; read by the api server.
idempotency_key_ttl_seconds = 86400
# Replay settings file (fill model) the API uses to simulate each observer's day result at GET /observers, the same simulation as `python -m aperture.research observers`, relative to the repo root; read by the api server.
replay_settings_file = "config/replay.toml"
# Most simulated trades (ENTERs, oldest first) GET /observers lists per observer; more = cut, with `trades_truncated` true; read by the api server (api/observer_results.py).
observer_trades_max_rows = 100
# Most rows GET /watching returns (the closest first; the answer's `total` counts them all); read by the api server.
watching_max_rows = 8
# Latest journal rows GET /journal returns (oldest first; `last_seq` is the newest row's number); read by the api server.
journal_rows = 40
# Decimal places of GET /watching `closeness` (0..1, rounded down); read by the api server.
watching_closeness_decimal_places = 4
# Decimal places of check measured and threshold values in /watching, /explain, /decisions and
# /skipped, each rounded so the shown pair keeps the recorded verdict; read by the api server.
check_decimal_places = 4
# Decimal places of GET /flow screener chips' `change_pct` (percent, rounded half-even); read by the api server.
flow_change_pct_decimal_places = 2
# Longest date range GET /performance accepts, in New York calendar days counting both ends; longer = 400 bad_request; read by the api server.
performance_max_range_days = 366
# Decimal places of GET /performance numbers that come from a division (R values, win rate, averages, profit factor), rounded half-even; read by the api server.
performance_decimal_places = 4
# Minutes after a closed trade's exit (day-v1) and after a skipped signal (skipped-v1) at which the API shows the price, the close of the M1 bar covering that moment; strictly increasing, each > 0; the last one also bounds the window of a trade's overshoot; read by the api server (api/after.py).
price_after_minutes = [1, 5, 15, 60]
# Decimal places of the R quotients the API computes for display, overshoot_r in day-v1, rounded half-even; read by the api server (api/after.py).
after_r_decimal_places = 4
# Lab "replay the last days" (POST /lab/replay): sessions the backtest replays, ending at the last fetched pool day; read by the api server.
lab_replay_sessions = 20
# Folder of the fetched backtest data the Lab replay reads (never fetches), relative to data_dir; read by the api server.
lab_replay_data_dir = "backtest"
# Folder of the Lab replay's run and result, relative to data_dir; only the latest run is kept; read by the api server.
lab_replay_results_dir = "lab-replay"
# `nice` increment of the Lab replay process (0-19, higher = lower CPU priority), so it never starves the bot; read by the api server.
lab_replay_niceness = 19
# true = the Lab replay is refused during the regular session of a trading day (calendar), to keep the CPU for the bot;
# read by the api server.
lab_replay_outside_session_only = true

[market_data]
# Seconds between discovery passes in the regular session; read by runtime (discovery scheduler).
discovery_interval_seconds = 60
# Seconds the L1 transport may stay down with a position open, in the regular session, before the position is closed
# through the normal exit path (spec 6: stream loss with a position = market exit); read by runtime.market.
stream_lost_exit_seconds = 30
# Exchange codes allowed in discovery: US exchanges (owner 2026-10-16; Webull `exchange_code`; probe M1 saw NYSE as "NYSE",
# Nasdaq as "NSQ"/"NMS", NYSE Arca as "PSE"). ETFs and warrants are excluded by security type below, never by exchange,
# so Arca-listed common stocks pass. The issuer's country is not filtered, so US-listed foreign companies (ADRs) pass;
# read by data.discovery.
allowed_exchanges = ["NMS", "NAS", "NSQ", "NYS", "NYSE", "ASE", "PSE"]
# Currencies allowed in discovery (screener `currency`); read by data.discovery.
allowed_currencies = ["USD"]
# Webull `category` sent with every screener, snapshot, bars and instrument-profile request; read by broker.webull market data.
screener_category = "US_STOCK"
# Security types allowed, as named by Webull's instrument profile (owner 2026-11-14: no ETFs, no warrants; ADRs on US
# exchanges are fine). Probe M1 proved the profile field `sub_category` (COMMON_STOCK, ETF, WARRANT; ADRs are
# COMMON_STOCK); a row whose type is unknown is refused. Read by data.discovery.
allowed_security_types = ["COMMON_STOCK"]
# Symbols per instrument-profile request (security type lookup, cached per symbol per New York day; limit unverified);
# read by broker.webull market data.
profile_symbols_per_request = 100
# Platform floor: maximum snapshot spread (ask - bid) / mid for a discovery candidate, ratio; read by data.discovery.
# Independent of strategies/<name>/strategy.toml [liquidity]: a strategy may be stricter; edit each on its own.
max_spread_ratio = 0.015
# Platform floor: minimum current-session dollar volume (sum of close x volume of completed M1 bars), USD; read by data.discovery.
# Independent of the strategy's min_dollar_volume_usd: a strategy may be stricter; edit each on its own.
min_session_dollar_volume_usd = 5000000
# Webull gainers/losers `rank_type` during the regular session (DAY_1 = today's change); read by broker.webull market data.
gainers_losers_rank_type = "DAY_1"
# Webull top-actives `rank_type` (RELATIVE_VOLUME_10D, as in the 2026-11-10 probe); read by broker.webull market data.
top_actives_rank_type = "RELATIVE_VOLUME_10D"
# Symbols per snapshot request (Webull docs: at most 100); read by data.discovery.
snapshot_symbols_per_request = 100
# Symbols per M1 bars request (Webull docs: 20); read by data.discovery.
bars_symbols_per_request = 20
# M1 bars requested per symbol in discovery (one regular session = 390 minutes); read by data.discovery.
bars_per_symbol = 390
# M1 bars asked per prior-session history request, per symbol (SDK maximum 1200; one regular session = 390);
# read by data.history.
history_bars_per_request = 1200
# Most history requests for one symbol per (symbol, day, sessions) before refusing with PAGE_LIMIT (five sessions need
# two at 1200 per request); read by data.history.
history_max_pages_per_symbol = 4
# Most calendar days walked back to find the requested prior sessions (weekends and holidays are skipped); read by
# data.history.
history_max_lookback_days = 14
# Prior regular sessions the bot loop loads per symbol for the active strategy (once per symbol per New York day, then
# cached), count; must be at least the active strategy's relative_volume_sessions or it refuses for missing history;
# read by runtime.evaluation.
history_sessions = 5
# Prior-session bar cache folder relative to [run] data_dir; files go to <history_dir>/<environment>/<NY date asked
# on>/<symbol>-<sessions>.jsonl (replay bar format); read by data.history.
history_dir = "history"
# Most discovery candidates (best first) kept on the L1 stream besides the position and the strategy's WATCH symbols, so
# a candidate has a fresh quote the minute the strategy first says ENTER; count. At most stream_max_symbols minus
# stream_reserved_symbols (checked when config loads); read by runtime.market.
candidate_subscriptions = 5
# Most observer WATCH/ENTER symbols kept on the L1 stream after the position, the strategy's WATCH symbols and the
# candidates, so observers can reach ENTER on their own symbols, and never more than the slots those leave free above
# stream_reserved_symbols; count. candidate_subscriptions plus this is at most
# stream_max_symbols minus stream_reserved_symbols (checked when config loads); read by runtime.market.
observer_subscriptions = 20
# Seconds between changes of the observer tier of the L1 stream (it shrinks at once when the position, WATCH symbols or
# candidates need its slots), so observers cost at most one subscribe and one unsubscribe request per period on routes
# shared with the active strategy's subscribes; read by runtime.market.
observer_resync_seconds = 60
# Subscribe (and unsubscribe) requests per budget window a candidate or observer request must leave free for the
# position, entry and WATCH symbols, count; below the route limit (requests_per_route_per_minute, route_limits) those
# tiers wait. Read by runtime.market for broker.webull StreamSession.subscribe_optional.
stream_reserved_subscribe_requests = 10
# Seconds candidates, or observer symbols, stay off the stream after their subscribe was refused (the position and
# WATCH symbols are never affected); read by runtime.market.
candidate_retry_seconds = 300
# Seconds before the L1 stream connects again after its loop ended (failed resubscribe or SDK gave up); read by broker.webull stream.
stream_reconnect_delay_seconds = 10
# Most symbols on the L1 stream connection, count. Webull's limit is 100 per connection, cumulative (probe M3: the
# subscribe past it is refused with HTTP 417 TOO_MANY_SYMBOLS_SUBSCRIPTION); never set above 100. A subscribe that would
# pass it is refused before sending (SubscriptionLimit); read by broker.webull stream.
stream_max_symbols = 100
# Stream slots never used by discovery candidates or observer symbols, kept for open positions and the strategy's WATCH
# symbols, count
# (position and WATCH symbols beyond stream_max_symbols get the same SubscriptionLimit refusal);
# read by config (checks candidate_subscriptions + observer_subscriptions <= stream_max_symbols - stream_reserved_symbols).
stream_reserved_symbols = 20
# Seconds without a received quote, transport up, after which a subscribed symbol is quiet; read by data.health.
quiet_after_seconds = 5
# Capture folder relative to [run] data_dir; files go to <capture_dir>/<environment>/<NY date>/; read by data.capture.
capture_dir = "capture"

[observers]
# Strategy module per strategy NAME, as "name=importable.module" (the module exposes create(values)); an observer folder
# strategies/<folder>/strategy.toml names its strategy in [strategy] name; read by observers.loader.
strategy_modules = ["price-action-v1=aperture.strategy.price_action_v1", "price-action-v2=aperture.strategy.price_action_v2", "volume-shock-v1=aperture.strategy.volume_shock_v1", "noise-band-v1=aperture.strategy.noise_band_v1"]
# Most observer strategies [strategy] observers may list (each one costs loop time per bar); read by observers.loader.
max_observers = 4
# Seconds one observer evaluation may take; slower = that observer is switched off for the run with a cause; read by observers.runner.
max_evaluation_seconds = 0.5
# Evaluations waiting for the observer worker thread; when full, a new one is dropped and recorded (never blocks trading);
# read by observers.runner.
queue_size = 256
# Seconds an observer's WATCH or ENTER keeps its symbol on the L1 stream, counted from the start of the bar it was decided
# on (180 = that bar, the next one while the worker is mid-bar, and one minute of pass timing); read by runtime.service.
watching_seconds = 180
# Decision records folder relative to [run] data_dir; files go to <decisions_dir>/<environment>/<NY date>/decisions.jsonl;
# written by observers.log for observer and active-strategy decisions (runtime.entries).
decisions_dir = "decisions"

[advisor]
# NAME of the environment variable holding the Anthropic API key (the SDK reads it itself; only ANTHROPIC_API_KEY works);
# presence is checked, the value is never read, printed or stored; read by advisor.client.
api_key_variable = "ANTHROPIC_API_KEY"
# Claude model that writes proposals (Anthropic model id); read by advisor.client.
model = "claude-opus-5-5"
# Effort level for the proposal request: low, medium, high, xhigh or max; read by advisor.client.
effort = "high"
# Maximum output tokens of one proposal response (streamed); read by advisor.client.
max_output_tokens = 64000
# Seconds one proposal request may take before it fails (no retry of a failed proposal run); read by advisor.client.
request_timeout_seconds = 900
# Fewest recorded trading days the advisor accepts as evidence; fewer = refused; read by advisor.run.
min_days = 5
# Most strategy.toml values one proposal may change; more = the proposal is refused; read by advisor.proposal.
max_changes = 3
# Largest evidence bundle sent to the model, bytes of JSON; larger = refused, never cut; read by advisor.run.
max_evidence_bytes = 400000
# Proposals folder relative to [run] data_dir; one sub-folder per run; read by advisor.run.
proposals_dir = "proposals"
# Backtest mode (--backtest): fewest simulated trades in the fitting period (before the report's hold-out) the advisor
# accepts as evidence; fewer = refused; count; read by advisor.backtest_evidence.
backtest_min_fitting_trades = 30
# Backtest mode: entry-price bucket edges of the evidence breakdown, USD, increasing (below the first, between edges,
# at or above the last); read by advisor.backtest_evidence.
backtest_price_edges_usd = [5, 20, 50]
# Backtest mode: bucket edges of the stop distance (entry - stop) / entry, percent, increasing; read by
# advisor.backtest_evidence.
backtest_stop_distance_edges_percent = [1, 2, 4, 8]
# Backtest mode: bucket edges, in R, of the best price reached while a trade was open and of the best price after a
# stop exit until the session end, both measured from the entry, increasing; read by advisor.backtest_evidence.
backtest_excursion_edges_r = [0, 0.5, 1, 2, 3]

[runtime]
# Minimum free disk space on the data_dir volume, megabytes; below it preflight fails; read by runtime.preflight.
min_free_disk_mb = 2048
# Seconds between checks of the bot child process and the stop flag by the launchd supervisor; read by runtime.supervisor.
supervisor_poll_seconds = 0.5
# Seconds launchd waits after SIGTERM before SIGKILL of the bot job (time to cancel entries and close); read by runtime.launchd.
bot_exit_timeout_seconds = 120
# Seconds after a forwarded SIGTERM before the supervisor alerts "bot did not stop" (must be below bot_exit_timeout_seconds); read by runtime.supervisor.
stop_alert_after_seconds = 90
# Preflight job start, Mac local time HH:MM, weekdays below; read by runtime.launchd when rendering plists.
preflight_start_local = "08:30"
# Bot job start, Mac local time HH:MM (must be before the 09:30 ET open), weekdays below; read by runtime.launchd.
bot_start_local = "09:00"
# launchd weekdays for the preflight and bot jobs (1 = Monday ... 5 = Friday); the calendar still decides; read by runtime.launchd.
launch_weekdays = [1, 2, 3, 4, 5]
# Watchdog job start, Mac local time HH:MM, same weekdays; it then waits for its calendar-derived checks; read by runtime.launchd.
watchdog_start_local = "09:05"
# First watchdog broker check this many seconds after the flatten time (15:57:30 ET on a normal day); must be above
# [session] flatten_grace_seconds so the bot's own day-end check comes first; read by runtime.watchdog.
watchdog_after_flatten_seconds = 150
# Last watchdog broker check this many seconds before the regular close (15:59 ET on a normal day); read by runtime.watchdog.
watchdog_before_close_seconds = 60
# Seconds between watchdog checks, during the regular session, that the bot runs whenever the database shows an open trade;
# read by runtime.watchdog.
watchdog_bot_check_seconds = 60
# The bot counts as running only while its status file (written every loop pass, about every [orders] detail_poll_seconds)
# is at most this many seconds old AND its lock records a live pid; must be above detail_poll_seconds and
# reconcile_interval_seconds; read by runtime.watchdog.
watchdog_status_stale_seconds = 60
# Watchdog journal (JSON lines: checks and alerts), relative to data_dir; never the bot's database; read by runtime.watchdog.
watchdog_journal_file = "watchdog.jsonl"
# From this many seconds before the flatten time (15:50 ET on a normal day) the watchdog starts the bot job once a day
# when the bot is not running and its database shows an open trade, so the bot's own flatten closes it; must be positive
# and below the last-entry-to-flatten time so the restarted bot can never open a trade; read by runtime.watchdog.
watchdog_restart_before_flatten_seconds = 300
# Command the watchdog runs to start the bot job (the same job the schedule starts: preflight, then the supervised bot);
# "{uid}" is replaced by the user id; kickstart without -k never touches a running job; read by runtime.watchdog.
watchdog_restart_command = ["/bin/launchctl", "kickstart", "gui/{uid}/local.aperture.bot"]
# Seconds the watchdog waits for the restart command to return before calling the attempt failed; read by runtime.watchdog.
watchdog_restart_timeout_seconds = 10
# Record of the watchdog's one restart a day (New York date), relative to data_dir; written before the command runs and
# never removed, so a day never gets a second attempt; read by runtime.watchdog.
watchdog_restart_file = "watchdog-restart.json"
# Seconds one loop pass may spend on market upkeep, discovery and the strategy before an
# evaluation-slow journal row (the next Detail read waits for it; keep it near
# [orders] detail_poll_seconds); read by runtime.service.
evaluation_budget_seconds = 3
# Stop marker the bot writes when it obeys a stop-bot command, relative to data_dir; while it exists preflight fails and
# `aperture run` refuses, until `aperture clear-stop`; read by runtime.stopmarker (bot, preflight, cli).
stop_marker_file = "stopped-by-operator.json"

[alerts]
# Same alert (kind + text) repeated within this many seconds is not shown again (still returned for the journal); read by runtime.alerts.
dedupe_window_seconds = 600
# Seconds to wait for the macOS notification command before giving up; read by runtime.alerts.
notification_timeout_seconds = 5
# Seconds a self-clearing fence (broker read failed, unknown order, foreign exposure, ...) must last before the bot alerts;
# fences that need the operator alert at once; read by runtime.watch.
fence_alert_after_seconds = 30
# NAME of the environment variable holding the owner's iMessage address (phone number or Apple ID email); the value is
# personal data, set only in the owner's env file, never here; presence checked by preflight; read by runtime.alerts.
imessage_recipient_variable = "APERTURE_IMESSAGE_TO"
# The Tickr Mac app that shows the Mac notification with its own icon (path to the .app; empty = none). When it is
# missing, not allowed to notify or fails, the notification goes through osascript instead; read by runtime.alerts.
mac_app = "/Applications/Tickr.app"
# Seconds to wait for the Tickr app to hand the notification over before osascript shows it instead (kept short: the
# bot's loop waits for it); read by runtime.alerts.
mac_app_timeout_seconds = 2

[chart]
# Serve GET /chart (the apps' chart: any US stock, M1 to monthly candles) from Webull market data. true makes the API
# process build its own Webull client in the background (it then needs the app key and secret, never the account id,
# and uses the environment's token folder next to the bot; until it is built GET /chart answers 503), and only once the
# newest `python -m aperture.probes chart-client` run recorded for the environment has passed (C1). Gate, per
# docs/webull-facts.md section C: C1 and C2 must pass first, and C1 in the environment being enabled (a Sandbox pass
# does not prove Production); C3 must pass before daily ranges (1m/3m/1y) are trusted, C4 before the newest minute and
# half days are; C5 is optional. false = GET /chart answers 503 unavailable (the demo serves its simulated world
# instead); read by the api server and the request budget.
webull_enabled = false
# Webull bars requests the API may send per 60 s for charts, count: the chart's own request budget, never the bot's;
# exhausted = GET /chart answers 429 rate_limited, nothing is queued or retried. With webull_enabled the bot's budget for
# the bars route is lowered by this many, so the two processes together stay within one route limit (in case Webull
# counts per App Key); with webull_enabled it must be below the bars route limit of every environment, which must be
# counted per 60 s (checked when the config is loaded); read by the request budget and the api server.
requests_per_minute = 4
# Most bars asked per chart bars request, count (SDK maximum 1200; one day with pre- and post-market is at most 960
# minutes, so one request covers a day); read by the api server.
bars_per_request = 1200
# Seconds the M1 bars of a day still in progress, and the daily series while a session day is not over, are served from
# memory before Webull is read again; closed days are kept on disk; read by the api server.
live_ttl_seconds = 30
# Seconds after a session's extended close (20:00 ET, 17:00 on half days) before its M1 bars count as final and are
# written to the disk cache; until then they are served from memory and read again after live_ttl_seconds (Webull
# returns only finalized minutes, so a read just after the close can miss the last one); a day without bars is never
# written; read by the api server.
closed_day_settle_seconds = 300
# Chart cache folder relative to [run] data_dir; settled days' M1 bars go to <cache_dir>/<environment>/<symbol>/<NY
# date>.json (minute bars are unadjusted, so a settled day never changes); read by the api server and maintain.
cache_dir = "chart"
# Days, counted back from today's New York date, a settled day's file stays in the chart cache; `aperture maintain`
# deletes older ones (a later chart of that day reads it from Webull again). At least session_lookback_days; read by
# maintain.
cache_max_age_days = 30
# Most calendar days walked back to find the sessions of a 1d or 5d chart range (weekends and holidays are skipped);
# read by the api server.
session_lookback_days = 14

[environments.sandbox]
# May this process send trading requests in this environment; read by the trading gate.
trading_enabled = true
# Trading additionally requires a valid owner authorization file; read by the trading gate.
requires_owner_authorization = false
# Owner authorization file, relative to the repo root (empty = none); read by the trading gate.
authorization_file = ""
# HTTPS API host (Webull docs); read by the broker adapter and the host allowlist.
http_host = "api.sandbox.webull.com"
# HTTPS port; read by the broker adapter.
http_port = 443
# MQTT quote-stream host; read by the market-data stream and the host allowlist.
mqtt_host = "data-api.sandbox.webull.com"
# MQTT port (TLS); read by the market-data stream.
mqtt_port = 1883
# gRPC order-event host (not used in v1); read by the host allowlist.
events_host = "events-api.sandbox.webull.com"
# Name of the env variable holding the app key; read by the broker adapter (presence only elsewhere).
app_key_variable = "WEBULL_SANDBOX_APP_KEY"
# Name of the env variable holding the app secret; read by the broker adapter (presence only elsewhere).
app_secret_variable = "WEBULL_SANDBOX_APP_SECRET"
# Name of the env variable holding the account id; read by the broker adapter (presence only elsewhere).
account_variable = "WEBULL_SANDBOX_ACCOUNT_ID"
# Token folder for this environment, relative to data_dir; read by the broker adapter.
token_dir = "webull-token-sandbox"
# Request budget per route per 60 seconds (Webull Sandbox limit); read by the request budget.
requests_per_route_per_minute = 30
# Seconds a route pauses after an HTTP 429; read by the request budget.
rate_limit_cooldown_seconds = 60
# Webull region id passed to the SDK client; read by the broker adapter.
region_id = "us"
# Seconds to wait for a TCP/TLS connection to the HTTP API; read by the broker adapter.
http_connect_timeout_seconds = 5
# Seconds to wait for an HTTP response after connecting; read by the broker adapter.
http_read_timeout_seconds = 10
# Seconds the SDK waits for the owner to approve a new token in the Webull app; read by the broker adapter.
token_check_duration_seconds = 300
# Seconds between token approval checks while waiting; read by the broker adapter.
token_check_interval_seconds = 5
# Maximum pages read when listing open orders; more pages = refuse as incomplete; read by the broker adapter.
open_orders_max_pages = 20
# Route-specific limits "<route path>" = [requests, window seconds]; empty = every route uses requests_per_route_per_minute; read by the request budget.
route_limits = {}

[environments.production]
# May this process send trading requests in this environment; false until the owner enables Production.
trading_enabled = false
# Trading additionally requires a valid owner authorization file; read by the trading gate.
requires_owner_authorization = true
# Owner authorization file, relative to the repo root; created by the owner, never committed.
authorization_file = "authorization/production.toml"
# HTTPS API host (Webull SDK); read by the broker adapter and the host allowlist.
http_host = "api.webull.com"
# HTTPS port; read by the broker adapter.
http_port = 443
# MQTT quote-stream host; read by the market-data stream and the host allowlist.
mqtt_host = "data-api.webull.com"
# MQTT port (TLS); read by the market-data stream.
mqtt_port = 1883
# gRPC order-event host (not used in v1); read by the host allowlist.
events_host = "events-api.webull.com"
# Name of the env variable holding the app key; read by the broker adapter (presence only elsewhere).
app_key_variable = "WEBULL_APP_KEY"
# Name of the env variable holding the app secret; read by the broker adapter (presence only elsewhere).
app_secret_variable = "WEBULL_APP_SECRET"
# Name of the env variable holding the account id; read by the broker adapter (presence only elsewhere).
account_variable = "WEBULL_ACCOUNT_ID"
# Token folder for this environment, relative to data_dir; read by the broker adapter.
token_dir = "webull-token-production"
# Request budget per route per 60 seconds: the strictest documented Production route (accounts, 10 per 30 s; docs, unverified) until per-route keys exist; read by the request budget.
requests_per_route_per_minute = 20
# Seconds a route pauses after an HTTP 429; read by the request budget.
rate_limit_cooldown_seconds = 60
# Webull region id passed to the SDK client; read by the broker adapter.
region_id = "us"
# Seconds to wait for a TCP/TLS connection to the HTTP API; read by the broker adapter.
http_connect_timeout_seconds = 5
# Seconds to wait for an HTTP response after connecting; read by the broker adapter.
http_read_timeout_seconds = 10
# Seconds the SDK waits for the owner to approve a new token in the Webull app; read by the broker adapter.
token_check_duration_seconds = 300
# Seconds between token approval checks while waiting; read by the broker adapter.
token_check_interval_seconds = 5
# Maximum pages read when listing open orders; more pages = refuse as incomplete; read by the broker adapter.
open_orders_max_pages = 20
# Route-specific limits "<route path>" = [requests, window seconds] (docs, unverified; never assume the looser value); read by the request budget.
route_limits = { "/trading/accounts/list" = [10, 30], "/trading/orders/get" = [2, 2], "/trading/orders/open-orders/list" = [2, 2], "/trading/assets/positions/list" = [2, 2], "/trading/orders/place" = [600, 60], "/trading/orders/cancel" = [600, 60], "/trading/orders/replace" = [600, 60] }
