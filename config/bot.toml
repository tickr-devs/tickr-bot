# Tickr platform settings. Every key has a comment: what it is, its unit, who reads it.
# Strategy values live in strategies/<name>/strategy.toml. Secrets never live here: only the
# NAMES of the environment variables that hold them.

[run]
# Active environment; must be a table under [environments]; read by config.load and the trading gate.
environment = "sandbox"
# Runtime data folder (database, capture files, lock), relative to the repo root; read by runtime and store.
data_dir = "data"
# Seconds a database write waits for another connection's write lock before failing; read by the store.
database_busy_timeout_seconds = 5
# Seconds each git command that reads the running code version (commit, tracked changes) may take before the bot run
# refuses to start; read by tickr.version (tickr run, the manual commands, preflight).
code_version_timeout_seconds = 5
# Daily verified database backup folder, relative to data_dir; one file per NY date, only the latest kept (spec 10); read by runtime.watch.
backups_dir = "backups"
# Seconds after a failed daily backup attempt before the bot tries again the same New York day (a transient disk or
# lock error must not cost the day's backup; review 2026-11-24 section 8); read by runtime.watch.
backup_retry_seconds = 300
# Closed sessions whose capture and decision folders `tickr maintain` leaves uncompressed (today is never touched);
# older finished days are gzipped in place; read by maintain.
maintain_keep_sessions = 20
# Days, counted back from today's New York date, an archived (all *.jsonl.gz) finished capture or decision day folder is
# kept; `tickr maintain --apply` deletes older ones. 0 = never delete (owner 2026-11-16: keep
# everything, docs/decisions.md); read by maintain.
maintain_archive_max_age_days = 0

[strategy]
# Active strategy name = folder under strategies/; its decisions may reach the safety layer.
active = "price-action-v3"
# Observer strategy folders under strategies/: they decide on the same live data on their own worker thread, never trade
# and never delay the trading loop (docs/observers.md); at most [observers] max_observers; read by runtime and the api server.
observers = ["price-action-v3-relvol-1.5", "price-action-v3-relvol-1.75"]
# Strategy names (folders under strategies/) whose ENTER may be admitted in the pre-market or post-market window; empty =
# none. No strategy defines what its session, day high or dollar volume mean outside the regular session yet (design:
# docs/decisions.md 2026-11-16), so none is listed; read by safety (admission check 5).
extended_hours_strategies = []

[risk]
# Planned loss per trade in USD (owner 2026-11-07). The only copy (owner 2026-11-15): every strategy sizes on it from
# SymbolContext.sizing (the bot, observers, replay, backtest); read by safety for the check too.
planned_loss_usd = 50
# Maximum notional per position in USD (owner 2026-11-17: 1000, with 20 positions in view). The only copy, like
# planned_loss_usd: every strategy caps its quantity at it (SymbolContext.sizing); read by safety for the check too.
position_notional_cap_usd = 1000
# Daily loss ceiling in USD: today's NET realized loss (wins offset losses) + open reservations + new planned loss (owner
# 2026-11-17: 5000, so the reservations of 20 trades at planned_loss_usd fit); read by safety.
max_daily_loss_usd = 5000
# Smallest daily-loss room a new trade is sized into, USD: near the ceiling a trade is sized down to the room left
# (owner 2026-11-14), but below this room entries stop and status says "daily ceiling" (a smaller trade is not worth
# its costs; owner confirmed 2026-11-14); read by runtime.entries (strategy loss budget and status).
min_daily_room_usd = 10
# Oldest broker read of the day buying power an entry may rely on, seconds: before admitting an entry the bot reads
# the account balance again when its last read is older, and refuses the entry (BUYING_POWER_UNKNOWN) when that read
# fails; the entry's value must fit the day buying power less the entry value of the bot's open trades (owner
# 2026-11-17: never send an order the account cannot pay for); read by runtime.entries and safety.
buying_power_max_age_seconds = 15
# Position slots: most open trades at once, count; a trade (working entry, position or exit in progress) takes one slot,
# at most one trade per symbol, every trade has its own broker stop and all share the daily loss ceiling (their planned
# losses are reserved against it). At most [market_data] stream_reserved_symbols (each position keeps a stream slot),
# and the session flatten (one stop at a time, up to [orders] max_stops_per_trade each, two [orders]
# detail_poll_seconds per stop) must fit before [session] close_order_cutoff_seconds (checked by the start-time checks,
# runtime.launchd.check_timings: 480 s at 20 slots, 4 stops and 3 s). Entries filling together are bounded by
# max_working_entries below, not by the slots. 6 since 2026-11-17 (owner); the owner's target of 20 waits for the daily
# loss and position size decision and the open-orders paging probe; read by safety, the engine and the status.
max_open_positions = 6
# Most of our entries working at once, count (a working entry also takes a slot, so max_open_positions caps it too): only working entries can fill in the same
# poll, and every one of them must get its verified stops within [orders] max_unprotected_seconds less a poll
# ((entries + 1 + [orders] stop_listing_polls) x [orders] detail_poll_seconds: one Detail read per fill, then the
# open-orders reads verifying the new stops; 6 at 3 s, 2 polls and 30 s; checked by runtime.launchd.check_timings).
# An entry beyond it is refused (WORKING_ENTRY_LIMIT_REACHED); read by admission and the start-time checks.
max_working_entries = 6
# Maximum quote age for any decision, seconds, end to end from provider time (owner 2026-10-15); read by safety and strategy input.
max_quote_age_seconds = 5
# Allowed lead of the provider clock over ours, seconds: a quote time up to this far ahead counts as age 0, further ahead = refuse; read by safety.
# Also the lead a bot status file's written_at may have over the watchdog's clock reading; read by runtime.watchdog.
max_clock_skew_seconds = 1
# Per-symbol pause after a loss (spec section 7, check 4; owner 2026-11-14): true = after a trade
# in a symbol closes at a loss today (New York date), no new entry in that symbol for the minutes
# below; false = off (the minutes are then not read but must still be at least 1); read by safety.
symbol_cooldown_after_loss_enabled = true
# Pause length in minutes from the losing trade's close; an entry exactly at the end is allowed (owner 2026-11-14); read by safety.
symbol_cooldown_minutes_after_loss = 30
# Longest a resting limit entry (a strategy's pullback buy below the ask, Decision.rest_bars) may work, in completed M1
# bars after the decision bar; a decision asking for more is refused (owner 2026-11-16); read by safety.
max_entry_rest_bars = 10
# Seconds between REST snapshot reads of one working entry's symbol while its stream quote is older than
# max_quote_age_seconds (owner 2026-11-17: a thin stock's L1 stream can stay silent for seconds while its book moves,
# the snapshot then often shows a fresh quote; the snapshot quote passes the same age and window checks, so one as old
# as the stream's still cancels the entry). All such symbols go in one request, so at most 60 / this many snapshot
# requests a minute (20), and only while a working entry's stream quote is too old; they share the snapshot route
# budget with discovery, whose pass stops early on a refusal and keeps its previous candidates; read by runtime.entries.
entry_snapshot_interval_seconds = 3

[session]
# Market time zone for all session times; read by the calendar and the scheduler.
timezone = "America/New_York"
# Calendar file with standard hours and exceptions, relative to the repo root; read by the calendar.
calendar_file = "config/calendar/us-equity-2026.json"
# Last entry this many minutes before the regular close (15:35 ET on a normal day; owner 2026-11-17, ten minutes before
# the flatten); read by safety.
last_entry_minutes_before_close = 25
# All positions closed this many minutes before the regular close (15:45 ET on a normal day; owner 2026-11-17: room for
# the flatten of up to 20 slots, one stop at a time, before close_order_cutoff_seconds); read by runtime.
flatten_minutes_before_close = 15
# Seconds after the flatten time before broker reads must show nothing of ours left (alert not-flat-after-flatten,
# day-end record); must cover the flatten of every slot ([risk] max_open_positions x [orders] max_stops_per_trade x 2 x
# detail_poll_seconds, 144 s at 6 slots, 480 s at 20) plus [orders] reconcile_interval_seconds (start-time check,
# runtime.launchd.check_timings); 500 s = 15:53:20 ET on a normal day, sized for 20 slots; read by runtime.dayend.
flatten_grace_seconds = 500
# Seconds before the regular close (the calendar's early close on a half day) from which no closing MARKET order is sent
# until the next regular open: the trade keeps its broker stop, the engine sets the market-closed fence and the owner gets
# the flatten-after-close alert; keep it below the flatten-to-close time; read by engine.manual.close_refusal.
close_order_cutoff_seconds = 60
# Trade on half days: false = no trading on half days; read by safety.
half_days_enabled = false
# Extended sessions (owner 2026-11-16). Each enabled session is its own trading window that flattens itself before it
# ends: no position is carried into the next session or overnight. Orders in them are LIMIT only with Webull session ALL.
# The offsets and sizes below are proposals awaiting the owner's confirmation before either session is enabled.
# config.load refuses either *_enabled = true until the bot-watched protection outside the regular session is built
# (Webull takes no stop there: F7 in docs/webull-facts.md; owner decision 2026-11-16 in docs/decisions.md).
# Trade in the pre-market (calendar premarket_open to regular_open, 04:00-09:30 ET); read by risk.timers.
premarket_enabled = false
# Pre-market: first entry this many minutes after the pre-market opens (05:00 ET: the first hour is the thinnest); read by risk.timers.
premarket_first_entry_minutes_after_open = 60
# Pre-market: last entry this many minutes before the regular open (09:15 ET); read by risk.timers.
premarket_last_entry_minutes_before_close = 15
# Pre-market: everything closed this many minutes before the regular open (09:25 ET), so nothing meets the opening
# auction; read by risk.timers.
premarket_flatten_minutes_before_close = 5
# Pre-market: share of the planned loss per trade and of the notional cap an entry may use (0.5 = half size); read by
# risk.timers.
premarket_size_fraction = 0.5
# Trade in the post-market (calendar regular_close to extended_close, 16:00-20:00 ET, 13:00-17:00 on half days); read
# by risk.timers.
postmarket_enabled = false
# Post-market: first entry this many minutes after the regular close (16:05 ET: after the closing prints); read by
# risk.timers.
postmarket_first_entry_minutes_after_open = 5
# Post-market: last entry this many minutes before the post-market closes (19:00 ET); read by risk.timers.
postmarket_last_entry_minutes_before_close = 60
# Post-market: everything closed this many minutes before the post-market closes (19:30 ET; assumed, not probed (F10
# in docs/webull-facts.md): DAY orders with session ALL expire at 20:00 ET); read by risk.timers.
postmarket_flatten_minutes_before_close = 30
# Post-market: share of the planned loss per trade and of the notional cap an entry may use (0.5 = half size); read by
# risk.timers.
postmarket_size_fraction = 0.5
# Pre-market: maximum quote age for an entry, seconds, from provider time; the regular session uses [risk]
# max_quote_age_seconds. Placeholder equal to it until probe Q1 (docs/webull-facts.md) shows which read is fresh there;
# read by safety.
premarket_max_quote_age_seconds = 5
# Post-market: maximum quote age for an entry, seconds, from provider time; placeholder as above until probe Q1; read by
# safety.
postmarket_max_quote_age_seconds = 5
# Pre-market: widest book an entry may meet, (ask - bid) / mid, on top of the strategy's own spread rule (the stricter
# wins): extended-hours books are thin. Proposal awaiting the owner; read by safety.
premarket_max_spread_ratio = 0.02
# Post-market: widest book an entry may meet, as above. Proposal awaiting the owner; read by safety.
postmarket_max_spread_ratio = 0.02
# Bot-watched stop outside the regular session (design v2.1 section 3): a breach is the bid at or under the stop on this
# many watch checks with a usable book since the last usable book above the stop. Counts checks, not distinct quotes:
# one unchanged book seen on two passes is two checks (a fallen thin stock whose book stops changing is still exited).
# A broken book neither counts nor clears them. Proposal awaiting the owner; read by risk.watched_stop.
extended_stop_confirm_checks = 2
# Bot-watched stop: seconds between two completed watch checks of a trade above which the watch is blind (a hung read or
# a stuck pass). Proposal awaiting the owner; read by risk.watched_stop.
extended_watch_max_gap_seconds = 10
# Bot-watched stop: seconds without a usable book above the stop (usable: both sides, not crossed, spread within the
# window's max_spread_ratio, provider time not ahead by more than [risk] max_clock_skew_seconds, and fresh or the feed
# proven alive) and without a confirmed breach, after which the watch is blind. Proposal awaiting the owner; read by
# risk.watched_stop.
extended_blind_seconds = 30

[orders]
# Prefix of bot client order ids; read by orders and reconciliation to recognise own orders.
# Kept "ap-" after the rename to Tickr on purpose: changing it would orphan orders placed under the old prefix.
client_order_id_prefix = "ap-"
# Prefix of probe client order ids; leftovers with it block the bot start; read by runtime.
probe_client_order_id_prefix = "probe-"
# Maximum client order id length in characters (Webull US stock limit); read by orders.
client_order_id_max_length = 32
# Seconds between Detail polls of a working order; read by orders (must fit the request budget).
detail_poll_seconds = 3
# Extra attempts to place a rejected protective stop before exiting the position; read by protection.
stop_retry_attempts = 2
# Seconds between protective stop attempts; read by protection.
stop_retry_spacing_seconds = 3
# Detail reads per engine step (Sandbox Detail route: 30 per 60 s; one read every 3 s = 20 per minute); read by the engine.
detail_reads_per_step = 1
# Extra cancel attempts after Detail shows an order still working after a cancel; then an operator fence; read by the engine.
cancel_retry_attempts = 2
# Seconds after a cancel before a Detail read showing the order still working counts as "cancel did not take"; read by the engine.
cancel_retry_spacing_seconds = 6
# Seconds a needed cancel may keep being refused by our request budget (nothing sent) before an operator alert and an entry fence; read by the engine.
cancel_not_sent_alert_seconds = 30
# Seconds a position may lack a verified broker stop before the engine closes it; read by the engine.
max_unprotected_seconds = 30
# Most broker stops one trade holds (each fill observation adds up to 2: its own and a split at the scale-out
# boundary). With [risk] max_open_positions above 1 only (owner 2026-11-17), an entry still working when its trade
# holds this many minus 2 is cancelled, so the last observation still fits; the session flatten cancels one stop at a
# time (checked by runtime.launchd.check_timings, at least 3); read by the engine and the start-time checks.
max_stops_per_trade = 4
# Open-orders reads (one per [orders] detail_poll_seconds) a new stop may be missing from after it was placed: Webull
# lists a stop 3.1-3.8 s after its place answer (probe T L1/L2, 2026-11-17, docs/webull-facts.md), longer than one
# poll, so a read right after the place and the next one may both miss it: 2; the list is read every poll while a new
# stop is unverified, and the start-time checks add this to the fills-together bound; read by runtime.launchd.check_timings.
stop_listing_polls = 2
# Share of a trade's stop distance (entry average fill less stop) from which one price tick counts as large: a new
# stop piece identical to a live one (same quantity and price, which Webull refuses as a duplicate) is then placed as
# quantity - 1 and 1 at the planned price instead of a tick higher (a cent is 0.67 % of a 1.50 USD stock), when both
# parts are new and fit [orders] max_stops_per_trade; below it, or when they do not, the price moves a tick. 0.1:
# a 2 % stop under 5 USD; read by the engine.
stop_split_tick_share = 0.1
# Seconds between the engine's order-history reads for fills (each up to history_fill_max_pages pages), made only
# while an entry of ours is working and more orders wait for Detail than [orders] detail_reads_per_step: entries
# filling together are then all seen by one read instead of one Detail read each (a row counts only when it shows
# more filled than recorded; Detail still finishes every order). Its pages must fit the order-history route limit on their own (checked at load; Sandbox 5 of
# 10 per 60 s, leaving the display's history_max_pages every balance_read_seconds room); a read refused by our budget
# is tried again the next step; read by the engine.
history_fill_poll_seconds = 12
# Most order-history pages one engine fill read takes before it stops (it stops as soon as every working entry was
# seen); a page's size is unproven (no multi-page body recorded); read by the engine and the config check above.
history_fill_max_pages = 1
# Seconds an order's Detail reads may keep failing (no answered read in between) before the engine sets the
# detail-unreadable fence (entries blocked, alert at once): the order's state is then unknown, a stop is no longer
# counted as verified and an entry or close no longer excuses a quantity mismatch; read by the engine.
detail_unreadable_seconds = 30
# Seconds after a closing order's send attempt before, still not filled, it sets the
# exit-not-filled operator fence and alert (nothing is resent); read by the engine.
max_exit_seconds = 30
# Seconds a SIGTERM shutdown may spend cancelling entries and protecting fills before it gives
# up with an alert (below the supervisor's 90 s alert and launchd's 120 s cap); read by the engine loop.
shutdown_deadline_seconds = 60
# Seconds between reconciliation passes (positions + open orders); read by runtime. Also the
# least spacing of the engine's own open-orders reads while a stop is held after an unresolved
# replace (engine._replace_blocks).
reconcile_interval_seconds = 10
# Maximum age in seconds of the last broker read before entries are blocked; read by safety.
broker_read_max_age_seconds = 30
# Consecutive "order not found" Detail reads before an order with an unknown send outcome is
# treated as never created; read by the engine.
unknown_absent_reads = 3
# Least seconds between two journal rows proving a working stop still had nothing filled: an
# unchanged Detail read the engine already makes writes an `order-held` row once this long after
# the order's last such proof (never an extra broker read); read by the engine, and the rows by
# api.history (the MAE/MFE window).
stop_held_proof_seconds = 60
# Least seconds between two `reconcile-checked` journal rows that say the same thing: after a
# successful reconciliation the bot journals whether the broker agreed with its records when the
# answer changed or the last such row is at least this old (no extra broker read); read by the
# runtime, and the rows by api.cleanday (the clean-day verdict of GET /days).
reconcile_proof_seconds = 300
# Largest gap in seconds between two `reconcile-checked` rows (the last one before the regular open
# and the first one after the regular close count as its edges) that a date can have and still be
# clean: a longer stretch without a recorded reconciliation (bot down, hours of failed reads) makes
# the date unknown. Must be above reconcile_proof_seconds; read by api.cleanday (GET /days).
reconcile_max_gap_seconds = 900
# Seconds between two rounds of the account display reads (balance, account kind once, today's
# fills from the order history), made on their own thread so the loop never waits on them; display
# only, shown in the account file; read by runtime.account.
balance_read_seconds = 60
# Seconds a finished own order with fills may go without recorded broker fees (from Detail, the
# order history or the cash activities) before the owner is alerted; meanwhile today's realized
# loss is unknown and entries are refused. Above balance_read_seconds, so the history read
# (every balance_read_seconds) gets its turn first; read by runtime.watch.
fees_unknown_alert_seconds = 180

[probe]
# Shares per probe order (owner 2026-11-14); read by the probe command.
quantity = 1
# Maximum share price in USD for a probe symbol; read by the probe command.
max_price_usd = 50
# Probe stop distance below the fill price, percent; read by the probe command.
stop_percent_below_fill = 2.0
# Maximum planned loss of a probe in USD; read by the probe command.
max_loss_usd = 5
# Earliest probe start, New York time HH:MM; read by the probe command.
window_start = "10:00"
# Latest probe start, New York time HH:MM; read by the probe command.
window_end = "15:30"
# Seconds to wait for the probe entry to fill before cancelling it; read by the probe command.
entry_wait_seconds = 60
# Seconds to hold a protected probe position before closing it; read by the probe command.
hold_seconds = 60
# Largest stop tightening in one probe-replace-stop, USD per share (new stop minus current stop); read by the probe-replace-stop command.
replace_max_move_usd = 0.50
# Seconds Detail of the stop is polled after a probe-replace-stop request, one read per detail_poll_seconds; read by the probe-replace-stop command.
replace_observe_seconds = 15
# Folder for the evidence of `python -m tickr.probes` (one sub-folder per New York date and run), relative to [run] data_dir; read by the probes.
evidence_dir = "probes"
# Processes `probes chart-limit` starts at once, count; each has its own Webull client and its own request budget; read by the probes.
chart_limit_processes = 2
# Bars requests each chart-limit process sends inside one bars route window, count; must be within the route limit, and all processes together must pass it (docs/webull-facts.md C2: 20 each against a limit of 30); read by the probes.
chart_limit_requests = 20
# Seconds between starting the chart-limit processes and their first request, so every process has built its Webull client by then; read by the probes.
chart_limit_start_delay_seconds = 20
# Bars reads `probes chart-client` makes next to the running bot, count; with chart_client_interval_seconds this is how long the bot is watched (20 x 30 s = 10 minutes, docs/webull-facts.md C1); read by the probes.
chart_client_reads = 20
# Seconds between two chart-client reads; keep 60 / this at or below half of [chart] requests_per_minute, so the API's own charts still fit in the chart's slice; read by the probes.
chart_client_interval_seconds = 30
# probe-extended (F7): least minutes left in the pre-market or post-market when it starts, so all four steps and the close
# fit before the session ends (about 8 minutes at worst); read by the probe-extended command.
extended_end_margin_minutes = 15
# probe-extended (F7): oldest snapshot quote, in seconds, it prices its orders from. Not [risk] max_quote_age_seconds:
# after hours even active stocks' quotes were 9-700 s old on 2026-11-16 (a quote that has not changed is still the
# market); its orders are 1 share and limit-priced; read by the probe-extended command.
extended_max_quote_age_seconds = 300
# probe-extended: acceptance-test BUY stops sit this many percent above the ask, so none can trigger; read by the probe-extended command.
extended_far_stop_percent = 20
# probe-extended: a STOP_LOSS_LIMIT's limit lies this many percent beyond its stop (above for a BUY, below for a SELL); read by the probe-extended command.
extended_stop_limit_percent = 2
# probe-extended: seconds an acceptance-test stop is read by Detail before it is cancelled; read by the probe-extended command.
extended_observe_seconds = 9
# probe-extended: seconds a SELL stop one tick below the bid is watched for a trigger before it is cancelled; read by the probe-extended command.
extended_trigger_seconds = 180
# probe-extended: the closing SELL LIMIT lies this many percent below the bid, so it fills at the bid in a thin book; read by the probe-extended command.
extended_close_percent = 2
# probe-extended: seconds the positions read may take to agree with the fills Detail proved, read once per
# [orders] detail_poll_seconds, before a SELL, the close or the final verdict; still different = the probe stops and
# exits 4; read by the probe-extended and probe-trailing commands.
extended_position_agree_seconds = 15
# probe-attached-stop (F8): the shape tests' MASTER LIMIT BUY sits this many percent below the bid (and a bracket's
# STOP_PROFIT LIMIT SELL this many percent above the ask), so neither can fill; read by the probe-attached-stop command.
attached_far_percent = 20
# probe-attached-stop: seconds each combo leg is read by Detail before the MASTER is cancelled, and again after it for
# its attached legs; read by the probe-attached-stop command.
attached_observe_seconds = 9
# probe-attached-stop: seconds the stop leg is read after the MASTER fills, until it is working for the filled
# quantity and listed in the open orders; read by the probe-attached-stop command.
attached_stop_wait_seconds = 30
# probe-trailing: the wide trailing stop's distance, percent (the rollout guide's 20 % trail for several positions); sent as
# trailing_stop_step = this / 100, the SDK sample's ratio form, and the stop price Detail shows says which unit Webull
# reads; read by the probe-trailing command.
trailing_wide_percent = 20
# probe-trailing (T6, T7): tight trailing stop distances, percent, tried smallest first until Webull accepts one (0.5
# sent as the ratio 0.005 was refused with OPENAPI_PARAM_ERR on 2026-11-17); the accepted one should trigger within
# trailing_trigger_seconds on an active stock; sent only once the wide stop proved the unit; read by the probe-trailing
# command.
trailing_tight_percents = [0.5, 1, 2, 3]
# probe-trailing (A3): AMOUNT trailing stop steps, USD, tried smallest first until Webull accepts one, which is cancelled
# at once; the smallest accepted is the answer; read by the probe-trailing command.
trailing_amount_steps_usd = [0.01, 0.02, 0.05, 0.1]
# probe-trailing: seconds the wide trailing stop is watched (Detail and a quote each [orders] detail_poll_seconds) for
# its stop price and whether it rises with the price, before it is cancelled; read by the probe-trailing command.
trailing_observe_seconds = 120
# probe-trailing: seconds the tight trailing stop is watched for a trigger before it is cancelled; read by the
# probe-trailing command.
trailing_trigger_seconds = 300
# probe-trailing: the closing SELL LIMIT lies this many percent below the bid, so it fills at once; read by the
# probe-trailing command.
trailing_close_percent = 1
# probe-trailing: T2 picks the unit (ratio or percent) whose distance is within this factor of the stop distance Detail
# shows; the two candidates differ a hundredfold and the stop follows the high, not the bid read with it, so cents do
# not decide; a ratio; read by the probe-trailing command.
trailing_unit_factor = 3
# probe-trailing: seconds the order history is read (once per [orders] detail_poll_seconds) after Detail shows the entry
# or the close filled, until it shows the same filled quantity (H1, how fresh one history read for all fills is);
# read-only, decides nothing; read by the probe-trailing command.
history_wait_seconds = 30
# probe-trailing (L2): BUY STOP_LOSS orders sent back to back before the entry, to measure how long open orders take to
# list stops placed together (the bot's bulk stop check and fills-together bound rely on it); a count; read by the
# probe-trailing command.
listing_stops = 5
# probe-trailing (L2): those stops lie this many percent above the ask, so none triggers while it is watched; read by the
# probe-trailing command.
listing_far_percent = 20
# probe-trailing (L2): seconds the open orders are read (once per [orders] detail_poll_seconds) until every stop placed
# together is listed, before all are cancelled; read by the probe-trailing command.
listing_wait_seconds = 30
# probe tick (python -m tickr.probes tick): seconds to wait for the stream connection before the probe gives up; read by
# tickr.engine.tick_probe.
tick_connect_wait_seconds = 30
# probe tick: seconds TICK and QUOTE messages are counted after both are subscribed for the given symbols (question 1:
# does TICK stream on our entitlement?); read by tickr.engine.tick_probe.
tick_flow_wait_seconds = 60
# probe tick: cumulative TICK symbol counts the cap ramp subscribes, ascending, one step after another, until a request
# is refused (question 2: how many symbols one connection may hold for TICK; QUOTE allows 100, probe M3); count; read by
# tickr.engine.tick_probe.
tick_cap_steps = [20, 50, 100, 101, 150, 200]
# probe tick: seconds between two cap steps, so ticks of the new symbols can arrive; read by tickr.engine.tick_probe.
tick_step_wait_seconds = 10
# Probe H2 (python -m tickr.probes history): most order-history pages read to see a page's size and the rows' order
# (each a request of the order-history route, sent once, within its budget); read by the history probe.
history_max_pages = 5
# Probe H2c (tickr probe-history-paging): far BUY LIMIT orders placed and cancelled one after another, so one day's
# history holds more rows than one page (44 seen on 2026-11-17); a count; read by tickr.engine.paging_probe.
paging_orders = 50
# Probe H2c: those limits lie this many percent below the bid, so none can fill; read by tickr.engine.paging_probe.
paging_far_percent = 20
# Probe H2c: seconds between two orders (each a place and a cancel: 30 sends a minute in Sandbox); read by
# tickr.engine.paging_probe.
paging_send_interval_seconds = 4
# Probe H2d (tickr probe-open-orders-paging): far BUY LIMIT orders (each [probe] paging_far_percent below the bid, one
# tick apart, sent [probe] paging_send_interval_seconds apart) kept working together while the open-orders list is
# read, then cancelled one by one; at least the orders the bot can hold at 20 slots (20 x [orders] max_stops_per_trade
# stops + [risk] max_working_entries entries = 86); a count; read by tickr.engine.paging_probe.
open_orders_paging_orders = 90
# Probe H2d: least minutes left in the extended session when the probe starts (placing, reading and cancelling 90 orders
# takes about 20 min); read by tickr.engine.paging_probe.
open_orders_end_margin_minutes = 30

[api]
# Local API bind address; loopback only; read by the api server.
host = "127.0.0.1"
# Local API port; read by the api server and the status screen.
port = 8766
# Host names the API answers to; requests whose Host (name:port) or Origin (http://name:port) is not one of these are refused (DNS rebinding / cross-site guard); read by the api server.
allowed_hosts = ["127.0.0.1", "localhost"]
# File, relative to data_dir, listing the Host headers (name, or name:port when not 443) the remote port answers to, one per line: the name of the HTTPS proxy in front of it, such as `tailscale serve` on this Mac, e.g. "mac.tailnet-name.ts.net". It names this machine, so it lives with the machine's data, never in this file; missing or empty = remote access off (the remote port is not opened); read by the api server and `pair` at start.
remote_hosts_file = "remote-hosts.txt"
# Second loopback port, for remote access only: every request on it must carry the paired bearer token whatever its Host, and `tailscale serve` points here, never at `port`; read by the api server.
remote_port = 8767
# File holding the SHA-256 (hex) of the paired phone's bearer token, relative to data_dir; written by `python -m tickr.api pair`, never the token itself; read by the api server.
remote_token_hash_file = "remote-token.sha256"
# File holding the SHA-256 (hex) of the iOS Simulator's own bearer token, relative to data_dir: a second token beside the phone's, so pairing one never revokes the other; written by `python -m tickr.api pair-simulator`, never the token itself; read by the api server, which then also answers the remote port on its loopback Host (host:remote_port) for the Simulator, and accepts that token there only; `unpair-simulator` deletes it.
remote_simulator_token_hash_file = "remote-simulator-token.sha256"
# File where `pair-simulator` leaves the Simulator's bearer token itself with the address it opens (JSON: address from host and remote_port, token), relative to data_dir, written 0600 and never printed, for a Simulator build of the iOS app on this Mac to read at launch (TICKR_SIMULATOR_TOKEN_FILE in apps/ios/Config/Local.xcconfig); deleted by `unpair-simulator`; read by the iOS app in the Simulator only.
remote_simulator_token_file = "remote-simulator-token"
# Local port `tickr demo` serves its made-up day's API on (docs/demo.md), for looking at it from a browser, `curl`, the layout sweep and the macOS screen tour; the apps' "Demo day" switch never uses it (the apps carry the demo day as a recording); 0 = no demo port (the demo's own copy of this file); read by the api server's config check and `tickr demo`.
demo_port = 8776
# Random bytes in a newly made bearer token and in a one-time pairing code (URL-safe text is about 4/3 as long), at least 16 (128 bits); read by `python -m tickr.api pair` and the api server (POST /pair).
remote_token_bytes = 32
# File where `pair` leaves the pairing link (it holds the one-time pairing code, never the token) for the owner to move to the phone, relative to data_dir; written 0600, never printed, deleted by the api server when the phone redeems the code or the code has expired; read by `pair` and the api server.
remote_pairing_file = "remote-pairing-link"
# File holding the SHA-256 (hex) of the waiting one-time pairing code and when it expires, relative to data_dir; written 0600 by `pair`, deleted by the api server when the code is redeemed or found expired; read by the api server (POST /pair).
remote_pairing_code_file = "remote-pairing-code.json"
# Seconds a pairing code stays redeemable after `pair` made it; later the phone gets 401 and the owner runs `pair` again; read by `pair`.
remote_pairing_code_ttl_seconds = 600
# Status file the bot writes and the API serves, relative to data_dir; read by the bot's status writer and the api server.
status_file = "status.json"
# Account file the bot writes after each successful broker read of positions and open orders (reconciliation) and the API serves at GET /account, relative to data_dir; read by the bot's account writer and the api server.
account_file = "account.json"
# Account document older than this many seconds is shown as stale; keep it above [orders] reconcile_interval_seconds; read by the api server.
account_stale_seconds = 30
# Command folder, relative to data_dir; the API writes into <commands_dir>/inbox, the bot consumes from there; read by the api server and the bot.
commands_dir = "commands"
# Status older than this many seconds is shown as stale (bot may be down); read by the api server.
status_stale_seconds = 15
# Last broker read older than this many seconds is shown as a warning (entries are blocked only past [orders]
# broker_read_max_age_seconds); keep it above [orders] reconcile_interval_seconds and below broker_read_max_age_seconds;
# read by the api server and returned to clients at GET /settings.
broker_read_warn_seconds = 15
# Seconds since the bot's quote stream last delivered any quote (GET /quotes stream_received_at, on the bot's clock)
# past which the apps show no quote as a live price, above 0; while it delivers, a symbol's newest quote is its market
# however long it has not changed. Without a live quote the apps use the captured one-minute bars or the screener's
# price instead (one bar long: past it a bar is as current as the quote). Read by the api server and returned to
# clients at GET /settings.
live_quote_max_age_seconds = 60
# Live quotes file the bot writes (the newest valid quote of every symbol on its quote stream) and the API serves at
# GET /quotes, relative to data_dir; read by the bot's quotes file thread and the api server.
quotes_file = "quotes.json"
# Seconds between two looks of the bot's quotes file thread at the stream; it rewrites the file only when a quote
# changed; above 0. Display only, its own thread, never the trading loop; read by runtime.quotes.
quotes_write_seconds = 0.5
# Seconds between two reads of GET /quotes by the apps (returned to them at GET /settings); with quotes_write_seconds
# this bounds how far a shown live price trails the stream; above 0; read by the api server.
quotes_poll_seconds = 1
# Seconds between refreshes of the status page, also returned to clients as a polling hint; read by the api server and the status page.
poll_seconds = 3
# Largest accepted command request body in bytes; larger = refused; read by the api server.
max_request_body_bytes = 1024
# Seconds either API port waits for a client's next bytes (request line, headers, body) before closing the connection, so an idle or slow connection cannot hold a server thread forever; read by the api server.
request_timeout_seconds = 10
# Maximum unconsumed commands waiting in the inbox; more = new commands refused; read by the api server.
max_pending_commands = 20
# A command older than this many seconds when the bot reads it is refused as expired, never executed late; read by the bot via read_commands, and served at GET /settings so the apps keep a lost send's Idempotency-Key no longer than this.
command_max_age_seconds = 60
# How many of the latest processed commands the bot lists in status.json (recent_commands); read by the bot's status writer.
status_recent_commands = 10
# Seconds the API remembers an Idempotency-Key and the 202 answer it gave (a repeat returns that answer and queues
# nothing); must be above command_max_age_seconds; keys are kept under <commands_dir>/idempotency; read by the api server.
idempotency_key_ttl_seconds = 86400
# Replay settings file (fill model) the API uses to simulate each observer's day result at GET /observers, the same simulation as `python -m tickr.research observers`, relative to the repo root; read by the api server.
replay_settings_file = "config/replay.toml"
# Most simulated trades (ENTERs, oldest first) GET /observers lists per observer; more = cut, with `trades_truncated` true; read by the api server (api/observer_results.py).
observer_trades_max_rows = 100
# Latest journal rows GET /journal returns (oldest first; `last_seq` is the newest row's number); read by the api server.
journal_rows = 40
# Command POST /commands/start-bot runs to start the bot job through launchd ("{uid}" = this user's id); kickstart
# without -k never restarts a job that is already running. Empty = start-bot answers 503 (no launchd: Docker, the
# demo); read by the api server.
start_bot_command = ["/bin/launchctl", "kickstart", "gui/{uid}/local.tickr.bot"]
# Seconds POST /commands/start-bot waits for start_bot_command to return before answering 503; read by the api server.
start_bot_timeout_seconds = 10
# Newest AI advisor runs GET /advisor returns (folders under [advisor] proposals_dir, newest first; its
# `awaiting_review` counts them all); count; read by the api server.
advisor_runs = 20
# Decimal places of GET /watching `closeness` (0..1, rounded down); read by the api server.
watching_closeness_decimal_places = 4
# Decimal places of check measured and threshold values in /watching, /explain, /decisions and
# /skipped, each rounded so the shown pair keeps the recorded verdict; read by the api server.
check_decimal_places = 4
# Decimal places of GET /flow screener chips' `change_pct` (percent, rounded half-even); read by the api server.
flow_change_pct_decimal_places = 2
# Longest date range GET /performance accepts, in New York calendar days counting both ends; longer = 400 bad_request; read by the api server.
performance_max_range_days = 366
# Decimal places of GET /performance numbers that come from a division (R values, win rate, averages, profit factor), rounded half-even; read by the api server.
performance_decimal_places = 4
# Minutes after a closed trade's exit (day-v1) and after a skipped signal (skipped-v1) at which the API shows the price, the close of the M1 bar covering that moment; strictly increasing, each > 0; the last one also bounds the window of a trade's overshoot; read by the api server (api/after.py).
price_after_minutes = [1, 5, 15, 60]
# Decimal places of the R quotients the API computes for display, overshoot_r in day-v1, rounded half-even; read by the api server (api/after.py).
after_r_decimal_places = 4
# Lab "replay the last days" (POST /lab/replay): sessions the backtest replays, ending at the last fetched pool day; read by the api server.
lab_replay_sessions = 20
# Folder of the fetched backtest data the Lab replay reads (never fetches), relative to data_dir; read by the api server.
lab_replay_data_dir = "nightly/current"
# Folder of the Lab replay's run and result, relative to data_dir; only the latest run is kept; read by the api server.
lab_replay_results_dir = "lab-replay"
# `nice` increment of the Lab replay process (0-19, higher = lower CPU priority), so it never starves the bot; read by the api server.
lab_replay_niceness = 19
# true = the Lab replay is refused during the regular session of a trading day (calendar), to keep the CPU for the bot;
# read by the api server.
lab_replay_outside_session_only = true
# true = GET /trades/whatif (another strategy version replayed on one trade's day) is refused during the regular
# session of a trading day (calendar), to keep the CPU for the bot; read by the api server.
trade_whatif_outside_session_only = true
# Days ahead of today (New York) GET /jobs looks in the session calendar for the next regular session, the apps'
# "Opens in" overnight and over weekends and holidays; none within them = null with a cause (the longest US closure
# run is a few days); read by the api server.
next_session_search_days = 10
# Machine services GET /system reports under `host`: "mac" (the launchd watchdog's journal and restarts, and
# caffeinate's no-sleep hold read with sleep_check_command) or "none" (a machine without them: `host` is null with a
# cause); read by the api server.
system_services = "mac"
# Command GET /system runs to list the Mac's power assertions (its output is parsed for caffeinate's no-sleep holds,
# nothing else is kept); used only when system_services = "mac"; read by the api server.
sleep_check_command = ["/usr/bin/pmset", "-g", "assertions"]
# Seconds GET /system waits for sleep_check_command before reporting the hold as unknown; read by the api server.
sleep_check_timeout_seconds = 2
# Newest watchdog restart records GET /system returns (newest first; the apps show a few and the rest on demand);
# read by the api server.
system_restart_rows = 50
# Training progress file a model training job writes (training-progress-v1, docs/api.md "GET /system"): relative to
# data_dir, or an absolute or ~/ path outside the release (research jobs never write into it); missing = no job
# reporting; read by the api server.
# Owner 2026-11-19: the research folder on the Mac, where the training scripts write it.
training_progress_file = "~/Development/Trading/.scratch/massive/results/feat/wide/training-progress.json"
# Folder, relative to data_dir, where the API keeps the built answers of past days (GET /flow, /watching, /symbols,
# /movers, /observers, /skipped; one folder per environment and NY date), so a past day picked in the apps shows at
# once; rebuilt whenever an input file, the config or the code changes; read and written by the api server
# (api/settled.py).
settled_cache_dir = "api-settled"
# Past days whose built answers the API keeps in memory (least recently read dropped first), count; read by the api
# server (api/settled.py).
settled_memory_days = 10
# Past days whose built answers (and trades' bar index) the API keeps on disk under settled_cache_dir (the newest by
# date; older day folders are deleted when a newer one is written), count; read by the api server (api/settled.py).
settled_disk_days = 30

[market_data]
# Seconds between discovery passes in the regular session, counted from the start of the minute the pass began, so with
# 60 every pass starts in the first loop pass of a minute and its bars reads (kept in data.todaybars) serve the strategy's
# evaluation of the minute just completed; read by runtime.market (discovery scheduler).
discovery_interval_seconds = 60
# Seconds the L1 transport may stay down with a position open, in the regular session, before the position is closed
# through the normal exit path (spec 6: stream loss with a position = market exit); read by runtime.market.
stream_lost_exit_seconds = 30
# Exchange codes allowed in discovery: US exchanges (owner 2026-10-16; Webull `exchange_code`; probe M1 saw NYSE as "NYSE",
# Nasdaq as "NSQ"/"NMS", NYSE Arca as "PSE"). ETFs and warrants are excluded by security type below, never by exchange,
# so Arca-listed common stocks pass. The issuer's country is not filtered, so US-listed foreign companies (ADRs) pass;
# read by data.discovery.
allowed_exchanges = ["NMS", "NAS", "NSQ", "NYS", "NYSE", "ASE", "PSE"]
# Currencies allowed in discovery (screener `currency`); read by data.discovery.
allowed_currencies = ["USD"]
# Webull `category` sent with every screener, snapshot, bars and instrument-profile request; read by broker.webull market data.
screener_category = "US_STOCK"
# Security types allowed, as named by Webull's instrument profile (owner 2026-11-14: no ETFs, no warrants; ADRs on US
# exchanges are fine). Probe M1 proved the profile field `sub_category` (COMMON_STOCK, ETF, WARRANT; ADRs are
# COMMON_STOCK); a row whose type is unknown is refused. Read by data.discovery.
allowed_security_types = ["COMMON_STOCK"]
# Symbols per instrument-profile request (security type lookup, cached per symbol per New York day; limit unverified);
# read by broker.webull market data.
profile_symbols_per_request = 100
# Webull gainers/losers `rank_type` during the regular session (DAY_1 = today's change); read by broker.webull market data.
gainers_losers_rank_type = "DAY_1"
# Webull gainers/losers `rank_type` the screener recorder reads in the pre-market (PRE_MARKET = the pre-market's change,
# 200 rows in tests/fixtures/webull/market_data/screener_gainers_losers_keys.json); read by broker.webull market data.
premarket_gainers_losers_rank_type = "PRE_MARKET"
# Webull gainers/losers `rank_type` the screener recorder reads in the post-market (AFTER_MARKET = the post-market's
# change, 200 rows in the same probe); read by broker.webull market data.
postmarket_gainers_losers_rank_type = "AFTER_MARKET"
# Webull top-actives `rank_type` (RELATIVE_VOLUME_10D, as in the 2026-11-10 probe); read by broker.webull market data.
top_actives_rank_type = "RELATIVE_VOLUME_10D"
# Symbols per snapshot request (Webull docs: at most 100); read by data.discovery.
snapshot_symbols_per_request = 100
# Symbols per M1 bars request (Webull docs: 20; probe 2026-11-16: 21 refused with HTTP 417); read by data.discovery,
# data.history (history pages) and runtime.evaluation.
bars_symbols_per_request = 20
# M1 bars requested per symbol in discovery (one regular session = 390 minutes); read by data.discovery.
bars_per_symbol = 390
# Requests of the bars route window (shared with the evaluation of positions, WATCH symbols and candidates, and their
# history pages) every discovery bars read and every pre-open history preload page must leave free, count; below the
# bars route limit of every environment (checked when config loads). Discovery stops its pass ("bars budget") rather than
# take them; read by data.discovery and runtime.preload.
discovery_bars_reserve_requests = 12
# Seconds one discovery pass may wait in all for its own request budget (a bars read our budget refused before sending,
# cause window_full or reserved; it still leaves discovery_bars_reserve_requests free) before it stops visibly ("bars
# budget"); a refusal whose wait does not fit what is left stops the pass at once, and a pause after an HTTP 429 always
# does. Snapshot reads never wait: that route keeps no reserve for the entry guard's snapshot reads. Back-to-back passes meet the
# previous pass's reads still in the 60 s window and freed again 1-6 s later (2026-11-23: 200 of 377 passes stopped,
# median wait 1.3 s); 0 = never wait; below discovery_interval_seconds; read by data.discovery.
discovery_budget_wait_seconds = 20
# M1 bars asked per prior-session history request, per symbol (SDK maximum 1200; probe 2026-11-16: count is per symbol,
# 20 symbols x 1200 served in one response; one regular session = 390); read by data.history.
history_bars_per_request = 1200
# Most history pages at a symbol's own end time per (symbol, day, sessions) before refusing with PAGE_LIMIT (five sessions
# need two at 1200 per request; pages where a thinner symbol is only carried along in its batch do not count); read by
# data.history.
history_max_pages_per_symbol = 4
# Most calendar days walked back to find the requested prior sessions (weekends and holidays are skipped); read by
# data.history.
history_max_lookback_days = 14
# Prior regular sessions the bot loop loads per symbol for the active strategy (once per symbol per New York day, then
# cached), count; must be at least the active strategy's relative_volume_sessions or it refuses for missing history;
# read by runtime.evaluation.
history_sessions = 5
# Most symbols' prior-session histories the bot keeps in memory, the most recently asked; the others are read again
# from their cache file under history_dir, with no request (one 5-session history is about 2 MB; 2026-11-16 the bot
# evaluated at most 251 symbols in any 10 minutes, while the pre-open preload reads several hundred); a minute that
# reads histories back from disk is journaled as history-reloaded (raise this when those rows appear every minute);
# count; read by data.history.
history_memory_symbols = 300
# Prior-session bar cache folder relative to [run] data_dir; files go to <history_dir>/<environment>/<NY date asked
# on>/<symbol>-<sessions>.jsonl (replay bar format); read by data.history.
history_dir = "history"
# Days, counted back from today's New York date, a day folder of the prior-session history cache is kept; `tickr
# maintain --apply` deletes older ones (the bot only reads today's folder); at least 1; read by maintain.
history_cache_max_age_days = 2
# Minutes before the regular open from which the bot loop loads the prior-session history of the symbols on the screeners
# (universe-filtered), so candidates have it at the open (9:00 ET on a normal day, owner 2026-11-16); 0 = no preload;
# read by runtime.preload.
history_preload_minutes_before_open = 30
# Seconds between two rounds of the screener recorder (gainers, losers, top actives) in the pre-market and post-market,
# captured to screener-recorded.jsonl for research; the pre-open preload takes its symbols from these rounds (3 screener
# requests per round, well inside the route's 30 per minute); read by runtime.screeners.
screener_record_seconds = 60
# Seconds before a loser's or big gainer's instrument profile (shortable, easy_to_borrow, margins) is read and captured
# again; every screener instrument is captured once a day when first listed; read by runtime.profiles.
profile_refresh_seconds = 300
# Move from the previous close, in percent of it, from which a gainer's profile is refreshed like a loser's; read by
# runtime.profiles.
profile_refresh_gainer_move_percent = 20
# Most instrument-profile requests the profile recorder sends per screener round (each up to
# profile_symbols_per_request symbols); the rest wait for the next round; read by runtime.profiles.
profile_max_requests_per_round = 3
# Instrument-profile requests the profile recorder leaves free in the route's minute window, for discovery's
# security-type lookups; read by runtime.profiles.
profile_reserve_requests = 10
# Seconds the pre-open preload pauses after a budget refusal or a failed read before its next batch; read by
# runtime.preload.
history_preload_retry_seconds = 60
# Most discovery candidates (best first) kept on the L1 stream besides the position and the strategy's WATCH symbols, so
# a candidate has a fresh quote the minute the strategy first says ENTER; count. At most stream_max_symbols minus
# stream_reserved_symbols (checked when config loads); read by runtime.market.
candidate_subscriptions = 5
# Most observer WATCH/ENTER symbols kept on the L1 stream after the position, the strategy's WATCH symbols and the
# candidates, so observers can reach ENTER on their own symbols, and never more than the slots those leave free above
# stream_reserved_symbols; count. candidate_subscriptions plus this is at most
# stream_max_symbols minus stream_reserved_symbols (checked when config loads); read by runtime.market.
observer_subscriptions = 20
# Seconds between changes of the observer tier of the L1 stream (it shrinks at once when the position, WATCH symbols or
# candidates need its slots), so observers cost at most one subscribe and one unsubscribe request per period on routes
# shared with the active strategy's subscribes; read by runtime.market.
observer_resync_seconds = 60
# Subscribe (and unsubscribe) requests per budget window a candidate or observer request must leave free for the
# position, entry and WATCH symbols, count; below the route limit (requests_per_route_per_minute, route_limits) those
# tiers wait. Read by runtime.market for broker.webull StreamSession.subscribe_optional.
stream_reserved_subscribe_requests = 10
# Seconds candidates, or observer symbols, stay off the stream after their subscribe was refused (the position and
# WATCH symbols are never affected); read by runtime.market.
candidate_retry_seconds = 300
# Seconds a symbol a market-data route refused as unknown (SymbolsRefused) stays refused without a request before
# discovery asks for it again (also forgotten when the next regular session starts); read by data.discovery via
# runtime.market. Kept across restarts through the day's discovery.jsonl pass records.
refused_symbol_recheck_seconds = 900
# Most characters of an error's text kept in a `discovery-failed` journal row's `detail` (longer text is cut, and the
# row says how long the whole text was); read by runtime.market.
failure_detail_max_chars = 300
# Seconds before the L1 stream connects again after its loop ended (failed resubscribe or SDK gave up); read by broker.webull stream.
stream_reconnect_delay_seconds = 10
# Most symbols on the L1 stream connection, count. Webull's limit is 100 per connection, cumulative (probe M3: the
# subscribe past it is refused with HTTP 417 TOO_MANY_SYMBOLS_SUBSCRIPTION); never set above 100. A subscribe that would
# pass it is refused before sending (SubscriptionLimit); read by broker.webull stream.
stream_max_symbols = 100
# Stream slots never used by discovery candidates or observer symbols, kept for open positions and the strategy's WATCH
# symbols, count
# (position and WATCH symbols beyond stream_max_symbols get the same SubscriptionLimit refusal);
# read by config (checks candidate_subscriptions + observer_subscriptions <= stream_max_symbols - stream_reserved_symbols).
stream_reserved_symbols = 20
# Seconds without a received quote, transport up, after which a subscribed symbol is quiet; read by data.health.
quiet_after_seconds = 5
# Capture folder relative to [run] data_dir; files go to <capture_dir>/<environment>/<NY date>/; read by data.capture.
capture_dir = "capture"

[observers]
# Strategy module per strategy NAME, as "name=importable.module" (the module exposes create(values)); an observer folder
# strategies/<folder>/strategy.toml names its strategy in [strategy] name; read by observers.loader.
strategy_modules = ["price-action-v1=tickr.strategy.price_action_v1", "price-action-v2=tickr.strategy.price_action_v2", "price-action-v3=tickr.strategy.price_action_v3", "volume-shock-v1=tickr.strategy.volume_shock_v1", "noise-band-v1=tickr.strategy.noise_band_v1", "ignition-v1=tickr.strategy.composed"]
# Most observer strategies [strategy] observers may list (each costs observer-process time per bar, not the trading
# thread's); read by observers.loader.
max_observers = 4
# Seconds one observer evaluation may take; slower counts as slow (see the next key); read by observers.runner.
max_evaluation_seconds = 0.5
# Slow evaluations in a row that switch an observer off for the run, with a cause (one slow evaluation is not proof: a
# garbage collection or a busy Mac stretches any; 2026-11-17 one 0.509 s evaluation switched one off); count; read by
# observers.runner.
max_slow_evaluations_in_row = 3
# Evaluations waiting for the observer process; when full, the rest of that pass is dropped for the observers and
# journaled as observers-dropped (never blocks trading, observers go on with the next pass); read by observers.runner.
queue_size = 256
# Seconds an observer's WATCH or ENTER keeps its symbol on the L1 stream, counted from the start of the bar it was decided
# on (180 = that bar, the next one while the worker is mid-bar, and one minute of pass timing); read by runtime.service.
watching_seconds = 180
# Decision records folder relative to [run] data_dir; files go to <decisions_dir>/<environment>/<NY date>/decisions.jsonl;
# written by observers.log for observer and active-strategy decisions (runtime.entries).
decisions_dir = "decisions"
# Seconds a symbol may go unevaluated before the bot and the observer process forget its bars (it is sent whole again
# if it comes back), so their memory stays bounded over the day; read by observers.runner.
forget_symbol_seconds = 600
# Most symbols per pass whose whole history (prior sessions and today's bars) is sent to the observer process; the
# others wait for a later pass (recorded as dropped), so the first passes of the day never send everything at once;
# count; read by observers.runner.
history_sends_per_pass = 30
# Screener-signal observer folder under strategies/ (observers.ignition: paper trades only, signal from the screener rows,
# exit on the L1 stream's observer tier and the discovery snapshots; records in <decisions_dir>/<environment>/<NY
# date>/ignition.jsonl); "" = off; read by cli (run) and runtime.market.
ignition = "early-thin-ignition-v1"

[advisor]
# NAME of the environment variable holding the Anthropic API key (the SDK reads it itself; only ANTHROPIC_API_KEY works);
# presence is checked, the value is never read, printed or stored; read by advisor.client.
api_key_variable = "ANTHROPIC_API_KEY"
# Claude model that writes proposals (Anthropic model id); read by advisor.client.
model = "claude-opus-5-5"
# Effort level for the proposal request: low, medium, high, xhigh or max; read by advisor.client.
effort = "high"
# Maximum output tokens of one proposal response (streamed); read by advisor.client.
max_output_tokens = 64000
# Seconds one proposal request may take before it fails (no retry of a failed proposal run); read by advisor.client.
request_timeout_seconds = 900
# Fewest recorded trading days the advisor accepts as evidence; fewer = refused; read by advisor.run.
min_days = 5
# Most strategy.toml values one proposal may change; more = the proposal is refused; read by advisor.proposal.
max_changes = 3
# Largest evidence bundle sent to the model, bytes of JSON; larger = refused, never cut; read by advisor.run.
max_evidence_bytes = 400000
# Proposals folder relative to [run] data_dir; one sub-folder per run; read by advisor.run.
proposals_dir = "proposals"
# Backtest mode (--backtest): fewest simulated trades in the fitting period (before the report's hold-out) the advisor
# accepts as evidence; fewer = refused; count; read by advisor.backtest_evidence.
backtest_min_fitting_trades = 30
# Backtest mode: entry-price bucket edges of the evidence breakdown, USD, increasing (below the first, between edges,
# at or above the last); read by advisor.backtest_evidence.
backtest_price_edges_usd = [5, 20, 50]
# Backtest mode: bucket edges of the stop distance (entry - stop) / entry, percent, increasing; read by
# advisor.backtest_evidence.
backtest_stop_distance_edges_percent = [1, 2, 4, 8]
# Backtest mode: bucket edges, in R, of the best price reached while a trade was open and of the best price after a
# stop exit until the session end, both measured from the entry, increasing; read by advisor.backtest_evidence.
backtest_excursion_edges_r = [0, 0.5, 1, 2, 3]

[model]
# Trained model switch (backlog R24..R26): true = the trained model decides entries; false = it is not loaded and the
# active strategy above decides as before. Must stay false until the live feed and the decision path are merged (config
# load refuses true until then); read by config.load and tickr.model.bundle.
enabled = false
# Folder of model bundles, relative to [run] data_dir; one subfolder <name>-<version> per bundle with manifest.json and
# one LightGBM file per head (docs: tickr.model.bundle); read by tickr.model.bundle.
bundles_dir = "models"
# Bundle folder name <name>-<version> under bundles_dir that the bot loads when enabled; empty = none chosen; read by
# tickr.model.bundle.
bundle = ""

[massive]
# Market data vendor of the model's inputs (owner 2026-11-20: the model's features come live from Massive, the same
# source as its training; Webull stays for orders, positions and the bot's lists). Read by tickr.model.massive only.
# REST host of Massive's reference data (splits, ticker types); read by tickr.model.massive.
api_host = "api.massive.com"
# WebSocket host of the real-time stocks stream (full-market minute aggregates, channel AM.*); read by
# tickr.model.massive.
stream_host = "socket.massive.com"
# Path of the stocks channel set on stream_host; read by tickr.model.massive.
stream_path = "/stocks"
# S3-compatible host of Massive's flat files, the same day files of minute bars the training
# reads; read by tickr.model.massive.
files_host = "files.massive.com"
# Bucket of the flat files on files_host; read by tickr.model.massive.
files_bucket = "flatfiles"
# Region named in the flat-files request signature (AWS Signature Version 4); read by tickr.model.massive.
files_region = "us-east-1"
# Key prefix of the minute aggregates day files in the bucket (<prefix>/YYYY/MM/YYYY-MM-DD.csv.gz); read by
# tickr.model.massive.
minute_aggs_prefix = "us_stocks_sip/minute_aggs_v1"
# NAMES of the environment variables holding the Massive API key and the flat-files key pair (in ~/.config/tickr/env);
# presence is checked, values are sent only in request headers and never printed, logged or stored; read by
# tickr.model.massive.
api_key_variable = "MASSIVE_API_KEY"
# NAME of the variable holding the flat-files access key id (same rules); read by tickr.model.massive.
files_key_id_variable = "MASSIVE_FILES_KEY_ID"
# NAME of the variable holding the flat-files secret key (same rules); read by tickr.model.massive.
files_secret_variable = "MASSIVE_FILES_SECRET"
# Folder, relative to [run] data_dir, of the minute-bar day files the model's 20-day history is built from; only the
# current window is kept, an older day is deleted (owner 2026-11-22: the full history lives in S3); read by
# tickr.model.massive.
history_dir = "massive/minute_aggs"
# Massive ticker types whose bars reach the feature code, as in the training's types file (common stocks and ADRs,
# types-5y.csv); read by tickr.model.massive.
stock_types = ["CS", "ADRC"]
# Seconds one REST or flat-file request may take before it fails; read by tickr.model.massive.
http_timeout_seconds = 120
# Rows asked per REST page (Massive's largest page for reference lists); read by tickr.model.massive.
page_limit = 1000
# Most REST pages one reference listing may take; more refuses the listing as incomplete; read by tickr.model.massive.
max_pages = 100
# Largest stream message accepted, bytes. Not measured yet (the first live day records the sizes): the websocket
# library's default of 1 MiB would cut a whole-market minute sent as one batch, so 16 MiB until measured; read by
# tickr.model.massive.
stream_max_message_bytes = 16777216
# Seconds before the stream connects again after it dropped (the day is marked gapped either way), also the longest
# wait of one read before the stop flag is checked again; a convenience pause, not a measured value, no decision
# depends on it; read by tickr.model.massive.
stream_reconnect_seconds = 5
# Calendar days searched back from today for the history sessions (20 sessions span about 28 calendar days with weekends
# and holidays; a search that finds fewer refuses); read by tickr.model.massive.
calendar_lookback_days = 60

[runtime]
# Minimum free disk space on the data_dir volume, megabytes; below it preflight fails and the running bot takes no new
# entry (fence disk-low); keep it well above zero, since the bot needs room to write its status, journal and database
# while it closes; read by runtime.preflight and runtime.service.
min_free_disk_mb = 2048
# Free disk space on the data_dir volume, megabytes, at or above which the running bot clears its disk-low fence again;
# above min_free_disk_mb so the fence does not flap while free space hovers at the floor; read by runtime.service.
disk_clear_free_mb = 3072
# Free disk space on the data_dir volume, megabytes, below which the watchdog alerts disk-low (once, and once more
# below min_free_disk_mb) at any hour, long before a full disk stops the bot (2026-11-19 it crashed at 0 bytes free);
# must be above min_free_disk_mb; read by runtime.watchdog.
disk_warn_free_mb = 10240
# Seconds between checks of the bot child process and the stop flag by the launchd supervisor; read by runtime.supervisor.
supervisor_poll_seconds = 0.5
# Seconds launchd waits after SIGTERM before SIGKILL of the bot job (time to cancel entries and close); read by runtime.launchd.
bot_exit_timeout_seconds = 120
# Seconds after a forwarded SIGTERM before the supervisor alerts "bot did not stop" (must be below bot_exit_timeout_seconds); read by runtime.supervisor.
stop_alert_after_seconds = 90
# Preflight job start, Mac local time HH:MM, before bot_start_local, weekdays below; read by runtime.launchd when rendering plists.
preflight_start_local = "03:30"
# Bot job start, Mac local time HH:MM, weekdays below: at the 04:00 ET pre-market open, so the screener lists are recorded
# from then on (runtime/screeners.py); before the regular open it only reads, it never enters (admission refuses outside
# the regular session); read by runtime.launchd.
bot_start_local = "04:00"
# launchd weekdays for the preflight and bot jobs (1 = Monday ... 5 = Friday); the calendar still decides; read by runtime.launchd.
launch_weekdays = [1, 2, 3, 4, 5]
# Watchdog job start, Mac local time HH:MM, same weekdays, at or before bot_start_local. It then runs at every hour, also
# nights and weekends (launchd starts it at load and again if it ends), and waits for its calendar-derived broker checks;
# read by runtime.launchd.
watchdog_start_local = "03:30"
# Nightly backtest-data refresh job start (`python -m tickr.backtest nightly`), Mac local time HH:MM, same weekdays: after the
# close. Until 20:00 ET it overlaps the bot's post-market screener recording: the screener routes are the bot's alone, but
# both use the instrument-profile route (the bot only for instruments new that day; a read refused there is a
# screener-skipped event, never a resend); it stops itself before the next open
# (config/backtest.toml); read by runtime.launchd.
nightly_fetch_start_local = "19:00"
# Rolling folder the nightly job keeps (current/ is what the Lab replays: [api] lab_replay_data_dir must point at it),
# relative to the repo root; read by runtime.launchd.
nightly_fetch_out = "data/nightly"
# A fetch-all folder the nightly job starts from while its folder has no current/ yet, relative to the repo root;
# read by runtime.launchd.
nightly_fetch_seed = "data/backtest"
# First watchdog broker check this many seconds after the flatten time (15:54 ET on a normal day); must be above
# [session] flatten_grace_seconds so the bot's own day-end check comes first; read by runtime.watchdog.
watchdog_after_flatten_seconds = 540
# Last watchdog broker check this many seconds before the regular close (15:59 ET on a normal day); read by runtime.watchdog.
watchdog_before_close_seconds = 60
# Seconds between watchdog checks, during the regular session, that the bot runs whenever the database shows an open trade;
# read by runtime.watchdog.
watchdog_bot_check_seconds = 60
# The bot counts as running only while its status file (written every loop pass, about every [orders] detail_poll_seconds)
# is at most this many seconds old AND its lock records a live pid; must be above detail_poll_seconds and
# reconcile_interval_seconds; read by runtime.watchdog.
watchdog_status_stale_seconds = 60
# Watchdog journal (JSON lines: checks and alerts), relative to data_dir; never the bot's database; read by runtime.watchdog.
watchdog_journal_file = "watchdog.jsonl"
# Watchdog alert state (which crash, disk level and calendar refusal it already alerted), relative to data_dir, so a
# relaunched watchdog never alerts the same finding twice; read by runtime.watchdog.
watchdog_state_file = "watchdog-state.json"
# Seconds after the bot process took its lock (the lock file's time) during which a live bot without a fresh status, or
# still "starting", counts as starting, not hung: covers the token wait (token_check_duration_seconds of every
# environment, which it must be above) and the startup reconcile; read by runtime.watchdog.
watchdog_start_grace_seconds = 600
# Least seconds between two launchd starts of the watchdog job (ThrottleInterval): a watchdog that keeps failing
# restarts at most this often; read by runtime.launchd when rendering plists.
watchdog_relaunch_seconds = 300
# From this many seconds before the flatten time (15:40 ET on a normal day) the watchdog starts the bot job once a day
# when the bot is not running and its database shows an open trade, so the bot's own flatten closes it; must be positive
# and below the last-entry-to-flatten time so the restarted bot can never open a trade (the earlier restart for a resting entry starts a run fenced
# by watchdog-started, so it cannot either); read by runtime.watchdog.
watchdog_restart_before_flatten_seconds = 300
# Command the watchdog runs to start the bot job (the same job the schedule starts: preflight, then the supervised bot);
# "{uid}" is replaced by the user id; kickstart without -k never touches a running job; read by runtime.watchdog.
watchdog_restart_command = ["/bin/launchctl", "kickstart", "gui/{uid}/local.tickr.bot"]
# Seconds the watchdog waits for the restart command to return before calling the attempt failed; read by runtime.watchdog.
watchdog_restart_timeout_seconds = 10
# Record of the watchdog's one restart a day (New York date), relative to data_dir; written before the command runs and
# never removed, so a day never gets a second attempt; read by runtime.watchdog.
watchdog_restart_file = "watchdog-restart.json"
# Record of the watchdog's one early restart a day for a resting limit entry (New York date), relative to data_dir: a bot
# that is down while an entry of a trade with a rest time still works at the broker is started at once, not at the restart
# time above, so its startup cancels that entry and protects any fill; written before the command runs and never removed;
# separate from watchdog_restart_file, so the flatten restart stays available; read by runtime.watchdog.
watchdog_entry_restart_file = "watchdog-entry-restart.json"
# Seconds one loop pass may spend on market upkeep and the strategy before an evaluation-slow journal row (the next
# Detail read waits for it; keep it near [orders] detail_poll_seconds). Discovery runs on its own thread and is not part
# of it: its duration is the `seconds` of each discovery journal row; read by runtime.service.
evaluation_budget_seconds = 3
# At the end of a run, seconds to wait for a discovery pass in flight, which stops before its next request (one market
# data request takes about 0.3 s); after that it is abandoned (a daemon thread) and the capture files close; read by
# cli (run) through runtime.market.
discovery_stop_seconds = 2
# Stop marker the bot writes when it obeys a stop-bot command, relative to data_dir; while it exists preflight fails and
# `tickr run` refuses, until `tickr clear-stop`; read by runtime.stopmarker (bot, preflight, cli).
stop_marker_file = "stopped-by-operator.json"
# Record of the last preflight (the morning preflight job and the bot job's own), relative to data_dir: its time,
# outcome and checks, replaced atomically after each run (a failed write is printed, never stops the job); read by
# runtime (writer) and the api server (GET /system).
preflight_result_file = "preflight.json"
# Seconds one outside step of `python -m tickr.runtime release` may take (git fetch and worktree, `uv sync`, the new
# release's preflight, which may wait [environments.*] token_check_duration_seconds for the token); must be above that
# wait; read by runtime.release.
release_step_timeout_seconds = 900
# Seconds `release` waits for a stopped job (bot, watchdog, api) to end before it reports the restart failed; must be
# above bot_exit_timeout_seconds, when launchd kills the bot job; read by runtime.release.
release_stop_wait_seconds = 150
# Seconds between `release` checks that a stopped job has ended; read by runtime.release.
release_poll_seconds = 1

[alerts]
# Same alert (kind + text) repeated within this many seconds is not shown again (still returned for the journal); read by runtime.alerts.
dedupe_window_seconds = 600
# Seconds to wait for the macOS notification command before giving up; read by runtime.alerts.
notification_timeout_seconds = 5
# Seconds a self-clearing fence (broker read failed, unknown order, foreign exposure, ...) must last before the bot alerts;
# fences that need the operator alert at once; read by runtime.watch.
fence_alert_after_seconds = 30
# NAME of the environment variable holding the owner's iMessage address (phone number or Apple ID email); the value is
# personal data, set only in the owner's env file, never here; presence checked by preflight; read by runtime.alerts.
imessage_recipient_variable = "TICKR_IMESSAGE_TO"
# The Tickr Mac app that shows the Mac notification with its own icon (path to the .app; empty = none). When it is
# missing, not allowed to notify or fails, the notification goes through osascript instead; read by runtime.alerts.
mac_app = "/Applications/Tickr.app"
# Seconds to wait for the Tickr app to hand the notification over before osascript shows it instead (the alert is sent
# on a background thread, so the bot's loop does not wait for it); read by runtime.alerts.
mac_app_timeout_seconds = 2
# Alerts feed: one JSON line per alert ({at, title, text}) appended by every process that alerts (bot, supervisor,
# preflight, watchdog, API), relative to [run] data_dir; a Claude session on the Mac waits on it so the project learns
# of an alert within seconds, not only the owner's phone (docs/operations.md "Alerts"); read by runtime.alerts.
feed_file = "alerts.jsonl"

[chart]
# Serve GET /chart (the apps' chart: any US stock, M1 to monthly candles) from Webull market data. true makes the API
# process build its own Webull client in the background (it then needs the app key and secret, never the account id,
# and uses the environment's token folder next to the bot; until it is built GET /chart answers 503), and only once the
# newest `python -m tickr.probes chart-client` run recorded for the environment has passed (C1). Gate, per
# docs/webull-facts.md section C: C1 and C2 must pass first, and C1 in the environment being enabled (a Sandbox pass
# does not prove Production); C3 must pass before daily ranges (1m/3m/1y) are trusted, C4 before the newest minute and
# half days are; C5 is optional. false = GET /chart answers 503 unavailable (the demo serves its simulated world
# instead); read by the api server and the request budget.
webull_enabled = true
# Webull bars requests the API may send per 60 s for charts, count: the chart's own request budget, never the bot's;
# exhausted = GET /chart answers 429 rate_limited, nothing is queued or retried. With webull_enabled the bot's budget for
# the bars route is lowered by this many, so the two processes together stay within one route limit (in case Webull
# counts per App Key); with webull_enabled it must be below the bars route limit of every environment, which must be
# counted per 60 s (checked when the config is loaded); read by the request budget and the api server.
requests_per_minute = 4
# Webull bars requests the API may send per 60 s for charts while no session runs (from a minute after the extended close
# to a minute before the next pre-market open, and all of weekends and holidays, by the session calendar), count: the
# chart's larger slice then, so a cold chart rarely waits (owner 2026-11-19). The bot-side processes (the bot, the
# nightly fetch) lose this many bars requests per 60 s from the moment the session ends to the moment the next one
# starts, so together they stay within one route limit (C2: Webull counts it per App Key); at least requests_per_minute
# and below the bars route limit of every environment; read by the request budget and the api server.
quiet_requests_per_minute = 12
# Most bars asked per chart bars request, count (SDK maximum 1200; one day with pre- and post-market is at most 960
# minutes, so one request covers a day); read by the api server.
bars_per_request = 1200
# Seconds the M1 bars of a day still in progress, and the daily series while a session day is not over, are served from
# memory before Webull is read again; closed days are kept on disk; read by the api server.
live_ttl_seconds = 30
# Seconds after a session's extended close (20:00 ET, 17:00 on half days) before its M1 bars count as final and are
# written to the disk cache; until then they are served from memory and read again after live_ttl_seconds (Webull
# returns only finalized minutes, so a read just after the close can miss the last one); a day without bars is never
# written; read by the api server.
closed_day_settle_seconds = 300
# Chart cache folder relative to [run] data_dir; settled days' M1 bars go to <cache_dir>/<environment>/<symbol>/<NY
# date>.json (minute bars are unadjusted, so a settled day never changes); read by the api server and maintain.
cache_dir = "chart"
# Days, counted back from today's New York date, a settled day's file stays in the chart cache; `tickr maintain`
# deletes older ones (a later chart of that day reads it from Webull again). At least session_lookback_days; read by
# maintain.
cache_max_age_days = 30
# Most calendar days walked back to find the sessions of a 1d or 5d chart range (weekends and holidays are skipped);
# read by the api server.
session_lookback_days = 14

[environments.sandbox]
# May this process send trading requests in this environment; read by the trading gate.
trading_enabled = true
# Trading additionally requires a valid owner authorization file; read by the trading gate.
requires_owner_authorization = false
# Owner authorization file, relative to the repo root (empty = none); read by the trading gate.
authorization_file = ""
# HTTPS API host (Webull docs); read by the broker adapter and the host allowlist.
http_host = "api.sandbox.webull.com"
# HTTPS port; read by the broker adapter.
http_port = 443
# MQTT quote-stream host; read by the market-data stream and the host allowlist.
mqtt_host = "data-api.sandbox.webull.com"
# MQTT port (TLS); read by the market-data stream.
mqtt_port = 1883
# gRPC order-event host (not used in v1); read by the host allowlist.
events_host = "events-api.sandbox.webull.com"
# Name of the env variable holding the app key; read by the broker adapter (presence only elsewhere).
app_key_variable = "WEBULL_SANDBOX_APP_KEY"
# Name of the env variable holding the app secret; read by the broker adapter (presence only elsewhere).
app_secret_variable = "WEBULL_SANDBOX_APP_SECRET"
# Name of the env variable holding the account id; read by the broker adapter (presence only elsewhere).
account_variable = "WEBULL_SANDBOX_ACCOUNT_ID"
# Token folder for this environment, relative to data_dir; read by the broker adapter.
token_dir = "webull-token-sandbox"
# Request budget per route per 60 seconds (Webull Sandbox limit); read by the request budget.
requests_per_route_per_minute = 30
# Seconds a route pauses after an HTTP 429; read by the request budget.
rate_limit_cooldown_seconds = 60
# Webull region id passed to the SDK client; read by the broker adapter.
region_id = "us"
# Seconds to wait for a TCP/TLS connection to the HTTP API; read by the broker adapter.
http_connect_timeout_seconds = 5
# Seconds to wait for an HTTP response after connecting; read by the broker adapter.
http_read_timeout_seconds = 10
# Seconds the SDK waits for the owner to approve a new token in the Webull app; read by the broker adapter.
token_check_duration_seconds = 300
# Seconds between token approval checks while waiting; read by the broker adapter.
token_check_interval_seconds = 5
# Maximum pages read when listing open orders; more pages = refuse as incomplete; read by the broker adapter.
open_orders_max_pages = 20
# Maximum pages of the order history read for today's fills (a display read on its own thread); more pages =
# refuse as incomplete, keeping the last good list; read by the broker adapter.
history_max_pages = 5
# Maximum pages of the cash activities read for today's exact trade amounts (a display read on its own thread);
# more pages = refuse as incomplete, keeping the last good list; read by the broker adapter.
cash_activities_max_pages = 5
# Route-specific limits "<route path>" = [requests, window seconds]; a route not listed uses requests_per_route_per_minute;
# the order history and the cash activities (display only) are kept well under the Sandbox 30 per 60 s; read by the request budget.
route_limits = { "/trading/orders/historical-orders/list" = [10, 60], "/trading/activities/cash-activities/list" = [10, 60] }

[environments.production]
# May this process send trading requests in this environment; false until the owner enables Production.
trading_enabled = false
# Trading additionally requires a valid owner authorization file; read by the trading gate.
requires_owner_authorization = true
# Owner authorization file, relative to the repo root; created by the owner, never committed.
authorization_file = "authorization/production.toml"
# HTTPS API host (Webull SDK); read by the broker adapter and the host allowlist.
http_host = "api.webull.com"
# HTTPS port; read by the broker adapter.
http_port = 443
# MQTT quote-stream host; read by the market-data stream and the host allowlist.
mqtt_host = "data-api.webull.com"
# MQTT port (TLS); read by the market-data stream.
mqtt_port = 1883
# gRPC order-event host (not used in v1); read by the host allowlist.
events_host = "events-api.webull.com"
# Name of the env variable holding the app key; read by the broker adapter (presence only elsewhere).
app_key_variable = "WEBULL_APP_KEY"
# Name of the env variable holding the app secret; read by the broker adapter (presence only elsewhere).
app_secret_variable = "WEBULL_APP_SECRET"
# Name of the env variable holding the account id; read by the broker adapter (presence only elsewhere).
account_variable = "WEBULL_ACCOUNT_ID"
# Token folder for this environment, relative to data_dir; read by the broker adapter.
token_dir = "webull-token-production"
# Request budget per route per 60 seconds: the strictest documented Production route (accounts, 10 per 30 s; docs, unverified) until per-route keys exist; read by the request budget.
requests_per_route_per_minute = 20
# Seconds a route pauses after an HTTP 429; read by the request budget.
rate_limit_cooldown_seconds = 60
# Webull region id passed to the SDK client; read by the broker adapter.
region_id = "us"
# Seconds to wait for a TCP/TLS connection to the HTTP API; read by the broker adapter.
http_connect_timeout_seconds = 5
# Seconds to wait for an HTTP response after connecting; read by the broker adapter.
http_read_timeout_seconds = 10
# Seconds the SDK waits for the owner to approve a new token in the Webull app; read by the broker adapter.
token_check_duration_seconds = 300
# Seconds between token approval checks while waiting; read by the broker adapter.
token_check_interval_seconds = 5
# Maximum pages read when listing open orders; more pages = refuse as incomplete; read by the broker adapter.
open_orders_max_pages = 20
# Maximum pages of the order history read for today's fills (a display read on its own thread); more pages =
# refuse as incomplete, keeping the last good list; read by the broker adapter.
history_max_pages = 5
# Maximum pages of the cash activities read for today's exact trade amounts (a display read on its own thread);
# more pages = refuse as incomplete, keeping the last good list; read by the broker adapter.
