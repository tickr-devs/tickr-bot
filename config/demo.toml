# `tickr demo`: a made-up trading day for looking at the apps with full data. The real bot runs
# on a simulated exchange (tickr.demo.world) inside its own folder; it never talks to Webull and
# never reads or writes the real data_dir. Every key has a comment: what it is, its unit, who reads it.
# Tickers are invented. Times are New York wall times "HH:MM"; prices are USD strings; volumes are
# shares per minute. Read by tickr.demo.

[demo]
# Folder the demo builds, relative to the repo root: its own copy of config/ and strategies/ plus its
# data/; deleted and rebuilt by every `tickr demo` (only when it holds the demo marker file).
root_dir = "demo"
# Environment name the demo copy of bot.toml runs as (a copy of the first environment whose trading
# gate is open without an owner authorization); the apps show it, so it says this is a demo.
environment = "demo"
# Local API port the demo serves on, so it never collides with a real API on [api] port.
api_port = 8776
# [strategy] observers in the demo copy of bot.toml: shadow strategies whose decisions the apps show.
observers = ["price-action-v2"]
# Simulated-exchange provider name written into the demo's capture files.
provider = "demo"
# New York time the bot starts each simulated session (before the open, for warm-up).
bot_start = "09:20"
# New York time the bot is stopped on past sessions (after the session flatten).
past_stop = "16:05"
# New York time the demo day is fast-forwarded to; from then on it runs in real time until Ctrl-C.
clock = "14:30"

[market]
# Half of the bid/ask spread of every simulated quote, USD.
half_spread_usd = "0.01"
# Bid and ask size of every simulated quote, shares.
quote_size_shares = "500"
# How far each simulated bar's high and low stick out beyond its open and close, USD.
wick_usd = "0.05"
# Volume per minute of the flat prior sessions every symbol gets as history (relative volume base).
history_volume = "3000"
# Texture of the demo's bars, so the charts look like a real tape (0 turns a part off); fractions.
# While the plan holds or drifts (a move smaller than wick_usd), a close sits at or below the
# planned price and every high reaches it, so noise never closes above the recent highs: the
# breakouts stay where the legs put them.
# Spread of the per-minute random step of the price's deviation from the planned path, of the price.
texture_drift = "0.0012"
# Share of that deviation kept into the next minute (below 1): the price wanders and comes back.
texture_pull = "0.9"
# Largest extra wick of a bar beyond its body, of the price.
texture_wick = "0.0015"
# Extra spread of that step on a moving bar, of the bar's planned move: red bars and pullbacks
# inside a run-up.
texture_move = "1.3"
# The most that extra spread can be, of the price, so a two-minute collapse stays a collapse.
texture_move_cap = "0.012"
# Largest change of a minute's volume either way, of that volume (below 1).
texture_volume = "0.45"
# Chart-only daily history, so the apps' D charts (1M, 3M, 1Y) and indicators such as RSI 14 have
# data: this many weekdays before the minute history ([market_data] history_sessions sessions)
# each get one D bar, a seeded random walk ending at the symbol's `base`. Holidays are not
# skipped. The feed serves them on D charts only; the bot never reads them. Count of days.
chart_days = 250
# Spread of a chart day's close against its open, of the price (below 1).
chart_daily_move = "0.025"
# Spread of a chart day's open against the previous close, of the price (below 1).
chart_daily_gap = "0.008"
# Largest high above and low below a chart day's body, of the price (below 1).
chart_daily_wick = "0.015"

[scenario]
# Symbols of the demo day (today if it is a trading session, else the latest session before it).
# Each: symbol; open price `base`; quiet `volume` per minute; `screener` list it appears on
# (GAINERS, LOSERS or TOP_ACTIVES); `legs` = [from, to, price at the end, volume per minute] moves,
# the price holds (wanders just below it, see texture) between them. The v1 bot holds one position
# at a time, so the breakouts come one after another: five stop-outs and one operator-flattened
# win use up about half of the daily loss room, and the last breakout is the open position when
# the demo goes live.
today = [
  # Breakout at the open, bought, then collapses through its stop: a loss.
  { symbol = "KXTR", base = "20.00", volume = "3000", screener = "GAINERS", legs = [["09:30", "09:45", "24.50", "30000"], ["10:00", "10:02", "21.00", "30000"]] },
  # Breakout that keeps climbing; the operator's flatten command at 10:24 takes a small win.
  { symbol = "VLNQ", base = "30.00", volume = "4000", screener = "GAINERS", legs = [["10:05", "10:20", "34.50", "30000"], ["10:20", "10:50", "35.60", "6000"]] },
  # Stopped out, then breaks out again inside the 30-minute pause after a loss: refused, see "why".
  { symbol = "ZNTH", base = "15.00", volume = "5000", screener = "TOP_ACTIVES", legs = [["11:00", "11:15", "18.20", "40000"], ["11:25", "11:27", "13.80", "40000"], ["11:35", "11:50", "17.40", "40000"]] },
  # Midday breakout that fails: a loss.
  { symbol = "PRQX", base = "42.00", volume = "6000", screener = "GAINERS", legs = [["12:00", "12:15", "47.50", "30000"], ["12:30", "12:32", "39.00", "30000"]] },
  # Another failed breakout: a loss.
  { symbol = "TRXQ", base = "26.00", volume = "7000", screener = "TOP_ACTIVES", legs = [["12:40", "12:55", "30.50", "40000"], ["13:10", "13:12", "24.00", "40000"]] },
  # And one more: the day is now close to its loss ceiling.
  { symbol = "HLQN", base = "11.00", volume = "9000", screener = "GAINERS", legs = [["13:20", "13:35", "14.20", "60000"], ["13:45", "13:47", "10.00", "60000"]] },
  # The open position: bought on the breakout into the room left, drifting up while the demo runs.
  { symbol = "MVLD", base = "24.00", volume = "9000", screener = "GAINERS", legs = [["13:55", "14:10", "28.50", "40000"], ["14:10", "15:30", "29.60", "9000"]] },
  # Breaks out while MVLD is held: risk refuses it (one position at a time), so the live flow's
  # refused tray has a symbol in it.
  { symbol = "QRTZ", base = "18.00", volume = "5000", screener = "GAINERS", legs = [["14:12", "14:24", "21.60", "40000"]] },
  # On the losers list all day: the strategy sees it and never finds a setup.
  { symbol = "BXVR", base = "36.00", volume = "5000", screener = "LOSERS", legs = [["09:30", "11:00", "31.50", "9000"], ["11:00", "15:30", "30.80", "5000"]] },
]

# Operator commands sent through the API inbox during the demo day: New York time, kind
# (contract CommandKind value) and symbol (flatten only; empty = everything).
commands = [
  { at = "10:24", kind = "flatten", symbol = "VLNQ" },
]

# Demo faults for QA, off by default (empty list). Each: New York time `at`, `kind` and a
# `symbol` of today. Kind "stop-unverified": from then on the simulated exchange shows that
# symbol's stops in a status the bot cannot map, not working, so the apps show the open position
# unprotected; after [orders] max_unprotected_seconds the bot closes it, as it would live. Example
# for the open position a minute after the demo goes live:
# faults = [{ at = "14:31", kind = "stop-unverified", symbol = "MVLD" }]
faults = []

# Past sessions for the day picker, oldest first, each a list of symbols like `today`. They run
# the whole session, so a position still open at the flatten time is closed by the bot.
past = [
  [
    { symbol = "KXTR", base = "18.00", volume = "3000", screener = "GAINERS", legs = [["09:30", "09:45", "22.00", "30000"], ["10:10", "10:12", "18.60", "30000"]] },
    { symbol = "PRQX", base = "40.00", volume = "5000", screener = "GAINERS", legs = [["10:30", "10:45", "45.00", "30000"], ["10:45", "15:30", "46.80", "6000"]] },
  ],
  [
    { symbol = "ZNTH", base = "14.00", volume = "4000", screener = "TOP_ACTIVES", legs = [["09:40", "09:55", "17.00", "40000"], ["10:20", "10:22", "14.40", "40000"]] },
    { symbol = "VLNQ", base = "28.00", volume = "5000", screener = "GAINERS", legs = [["10:40", "10:55", "32.00", "30000"], ["11:30", "11:32", "28.50", "30000"]] },
  ],
  [
    { symbol = "MVLD", base = "22.00", volume = "3000", screener = "GAINERS", legs = [["09:30", "09:45", "26.00", "30000"], ["09:45", "15:30", "27.10", "5000"]] },
    { symbol = "HLQN", base = "10.00", volume = "6000", screener = "LOSERS", legs = [["09:30", "12:00", "8.90", "8000"]] },
  ],
  [
    { symbol = "HLQN", base = "10.00", volume = "6000", screener = "GAINERS", legs = [["10:00", "10:15", "12.80", "60000"], ["11:00", "11:02", "9.00", "60000"]] },
    { symbol = "TRXQ", base = "25.00", volume = "6000", screener = "GAINERS", legs = [["11:30", "11:45", "29.00", "40000"], ["11:45", "15:30", "30.20", "8000"]] },
  ],
]
