# Settings of the offline backtest tool (python -m tickr.backtest). Every result is SIMULATED.
# Read only by src/tickr/backtest/; the trading bot never reads this file. See docs/backtest.md.
# Universe lists, the dollar-volume floor and request sizes come from config/bot.toml, fills and
# history depth from config/replay.toml.

[backtest]
# A symbol counts as a gainer from the first completed M1 bar whose close is at least this many percent above the
# previous session's last close (proxy for being on Webull's top-200 gainers list); a day enters the pool when its
# daily high reaches it. Percent; read by backtest/universe.py and backtest/gate.py.
gainer_change_percent = 5.0
# Most pool symbols per session, best daily-high change first. The ranking uses the day's high (look-ahead), so this
# is set high enough not to bind; pool_cap.csv and the report show any session where it did; count; read by
# backtest/universe.py.
max_pool_per_day = 2000
# Most instrument-list pages read before refusing (guards a pagination key that never ends); count; read by
# backtest/fetch.py.
instrument_max_pages = 100
# Most M1 pages per symbol and contiguous run of sessions before that run is recorded incomplete (1200 bars per page
# is about three sessions); count; read by backtest/fetch.py.
minute_max_pages_per_run = 40
# Symbols fetched together before their bar files are written (bounds memory; a rerun skips written symbols); count;
# read by backtest/fetch.py.
symbols_per_wave = 200
# Worker processes for the strategy run (one symbol per task); count; read by backtest/run.py.
workers = 4
# Bootstrap resamples of the per-trade R for the confidence interval of the mean; count; read by backtest/report.py.
bootstrap_samples = 2000
# Seed of the bootstrap random generator, so a report is reproducible; integer; read by backtest/report.py.
bootstrap_seed = 7
# Two-sided confidence level of the interval for the mean R per trade, percent; read by backtest/report.py.
confidence_percent = 95
# Entry-price bucket edges for the report breakdown, USD, increasing (buckets: below the first, between edges, at or
# above the last); read by backtest/report.py.
price_bucket_edges_usd = [5, 20, 50]
# Largest disagreement between the daily (forward-adjusted) and M1 (unadjusted) price scales of the previous session
# and the pool day, percent; more means a split or reverse split between them, and the day is skipped with a cause
# (the gate's change against the previous M1 close would be meaningless); read by backtest/run.py.
split_tolerance_percent = 2
# Share of the window's sessions, the most recent ones, reported separately as a hold-out (the earlier sessions are
# reported on their own too), percent; read by backtest/report.py.
holdout_percent = 33
# Instrument `status` values (Webull instrument profile) kept in the universe. Measured 2026-11-14 on 1020 symbols:
# every OC symbol had daily bars, 314 of 397 NT symbols were refused by the bars route as INVALID_SYMBOL and most of
# the rest had no bars, CO was mixed; read by backtest/fetch.py.
instrument_statuses = ["OC", "CO"]
# Rule "liquid" of `select` (a universe without look-ahead, for research beyond gainers): per session, this many
# symbols with the highest previous-session dollar volume; count; read by backtest/universe.py.
liquid_top_count = 300
# Rule "liquid": lowest previous-session close a symbol may have to be ranked, USD; read by backtest/universe.py.
liquid_min_price_usd = 10
# Nightly refresh (`nightly`, docs/backtest.md): sessions the rolling folder keeps, the newest ending at the last
# completed session; older pool days and the minute files only they used are dropped; count; read by
# backtest/nightly.py.
nightly_window_sessions = 60
# Most missing sessions one night adds; more (a long gap) is refused, run fetch-all instead: a night under Webull's
# rate limits fits a few sessions, not weeks; count; read by backtest/nightly.py.
nightly_max_new_sessions = 3
# Free disk space the data volume must have before a night starts, megabytes; read by backtest/nightly.py.
nightly_min_free_disk_mb = 5000
# A night stops (and keeps the old data) this many minutes before the next session's regular open, so it never
# shares the market-data budget with the bot's pre-market start; minutes; read by backtest/nightly.py.
nightly_stop_minutes_before_open = 120
