name: ci
# Python tests. Skipped when a change touches only docs/, the root README/CLAUDE.md or app (Swift)
# sources; markdown under tests/ is scanned for account ids, so it always runs. The Swift code
# rules that the Python suite also checks run in swift-rules on every pull request.
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CLAUDE.md"
      - "apps/ios/**"
      - "apps/macos/**"
      - "apps/shared/**"
      - "Aperture.xcworkspace/**"
      - ".github/workflows/ios-app.yml"
      - ".github/workflows/macos-app.yml"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CLAUDE.md"
      - "apps/ios/**"
      - "apps/macos/**"
      - "apps/shared/**"
      - "Aperture.xcworkspace/**"
      - ".github/workflows/ios-app.yml"
      - ".github/workflows/macos-app.yml"
# One run per branch: a new push cancels the run still going for the previous one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,webull]"
      - run: ruff check .
      - run: pytest -q
  docker:
    # Builds the server image and checks the compose example (docs/deploy-server.md); never pushes.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aperture:ci .
      - run: docker compose -f ops/docker/compose.yaml --profile jobs config -q
        env:
          APERTURE_CONFIG_HOST: /srv/aperture/etc/bot.toml
          APERTURE_ENV_FILE_HOST: /srv/aperture/etc/env
