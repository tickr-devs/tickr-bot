name: ci
# Python tests. The `python-tests` job always reports, because it is a required check and a workflow
# skipped by path filters never reports it. Its steps (and the demo-fixture and docker-image jobs) are
# skipped when a pull request touches only docs/ or the root README/CLAUDE.md (the conflict-marker
# check still runs); markdown under tests/ is scanned for account ids, so it always counts. The
# workflows always count: the suite reads them (tests/test_workflows.py checks the job names).
# Pushes to main and the merge queue always run everything.
on:
  pull_request:
  # The merge queue: the required checks run again on the queued change on top of the newest main
  # (and of the changes queued ahead of it), so two separately green pull requests cannot break main.
  merge_group:
  push:
    branches: [main]
# One run per pull request: a new push cancels the run still going for the previous one. Runs on
# main are never cancelled (a later merge used to cancel the earlier commit's run, so a commit that
# broke main went unnoticed): each merged commit gets its own run, in its own group.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# The workflow only reads the repository: its token can change nothing.
permissions:
  contents: read
jobs:
  python-changes:
    # Says whether this change touches anything the Python suite or the image depends on.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.diff.outputs.python }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Its own command, so a failing diff stops the job instead of reading as "no changes".
          files=$(git diff --name-only --no-renames "$BASE...$HEAD")
          # Workflows are never skipped: tests/test_workflows.py reads them.
          others=$(printf '%s\n' "$files" | grep -Ev \
            '^(docs/|README\.md$|CLAUDE\.md$)' \
            || true)
          if [ -n "$others" ]; then echo "python=true"; else echo "python=false"; fi >> "$GITHUB_OUTPUT"
  python-tests:
    needs: python-changes
    # Runs even when `python-changes` failed, so the required check fails instead of being skipped.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - if: needs.python-changes.result != 'success'
        run: |
          echo "The changed-files check failed."
          exit 1
      - if: needs.python-changes.outputs.python != 'true'
        run: echo "Only docs changed; Python checks skipped."
      - uses: actions/checkout@v7
      # Before the skip: this required job runs on every pull request, docs-only ones too.
      - name: No git conflict markers in tracked files
        run: python3 .github/scripts/check_conflict_markers.py
      # uv installs exactly what uv.lock pins (ruff and pytest included), so a new release of a
      # dependency cannot fail an unrelated pull request. Action pinned by commit: it has no major tag.
      - if: needs.python-changes.outputs.python == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true
      - if: needs.python-changes.outputs.python == 'true'
        run: uv sync --frozen --extra dev --extra webull --extra model
      - if: needs.python-changes.outputs.python == 'true'
        run: uv run --no-sync ruff check .
      # One pytest process per core (pytest-xdist): the suite's tests share no state.
      # --dist worksteal: an idle worker takes tests queued on a busy one, so the slow model
      # modules no longer end the run on one worker alone (2026-11-27, 4 cores: 435 s -> 330 s).
      - if: needs.python-changes.outputs.python == 'true'
        run: uv run --no-sync pytest -q -n auto --dist worksteal
  demo-fixture:
    # Builds the real demo fixture from the committed inputs (docs/demo.md): the fixture is never
    # committed, every Mac builds its own, so a change that breaks the build (the demo day not flat
    # at [demo] clock, the bot failing) fails here instead of on the Mac. Runs beside `python-tests`.
    needs: python-changes
    if: needs.python-changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # uv installs exactly what uv.lock pins (ruff and pytest included), so a new release of a
      # dependency cannot fail an unrelated pull request. Action pinned by commit: it has no major tag.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --no-sync tickr demo --build-fixture
      - run: ls -l demo-fixture
  docker-image:
    # Builds the server image and checks the compose example (docs/deploy-server.md); never pushes.
    needs: python-changes
    if: needs.python-changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TICKR_CONFIG_HOST: /srv/tickr/etc/bot.toml
      TICKR_ENV_FILE_HOST: /srv/tickr/etc/env
      TICKR_BOT_EXIT_TIMEOUT: "1"
      TICKR_NIGHTLY_OUT: data/nightly
      TICKR_NIGHTLY_SEED: data/nightly-seed
      TICKR_DATA_HOST: /srv/tickr/data
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t tickr:ci .
      # compose runs the image TICKR_IMAGE names (on the server: the release image, through
      # limits.env), here the one just built; every service runs it.
      - run: |
          docker compose -f ops/docker/compose.yaml --profile jobs config -q
          test "$(docker compose -f ops/docker/compose.yaml --profile jobs config --images | sort -u)" = tickr:ci
        env:
          TICKR_IMAGE: tickr:ci
      # Without TICKR_IMAGE compose refuses: there is no default image and nothing to build.
      - run: |
          if docker compose -f ops/docker/compose.yaml --profile jobs config -q; then
            echo "compose accepted a missing TICKR_IMAGE" >&2
            exit 1
          fi
      # The server has no clone: deploy-server.sh renders the units inside the release image and
      # compares the host's compose.yaml with the image's own copy; the server takes the script from
      # the image. All three must be in it.
      - run: |
          out=$(mktemp -d)
          chmod 777 "$out"
          docker run --rm --pull never --network none --entrypoint python \
            --mount "type=bind,source=$PWD/config/bot.toml,target=/app/config/bot.toml,readonly" \
            --mount "type=bind,source=$PWD/ops/docker/compose.yaml,target=/srv/tickr/etc/compose.yaml,readonly" \
            --mount "type=bind,source=$out,target=/out" \
            tickr:ci -m tickr.runtime --config /app/config/bot.toml render-systemd \
            --compose /srv/tickr/etc/compose.yaml --image tickr:ci --out /out
          grep -qx 'TICKR_IMAGE=tickr:ci' "$out/limits.env"
          grep -qx 'ExecStart=/usr/bin/flock /srv/tickr/data/control/compose.lock /usr/bin/docker compose -f /srv/tickr/etc/compose.yaml --profile jobs up -d bot' "$out/tickr-bot.service"
          docker run --rm --pull never --network none --entrypoint cat tickr:ci \
            /app/ops/docker/compose.yaml | cmp - ops/docker/compose.yaml
          docker run --rm --pull never --network none --entrypoint cat tickr:ci \
            /app/ops/systemd/deploy-server.sh | cmp - ops/systemd/deploy-server.sh
