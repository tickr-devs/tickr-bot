name: schedule-probe
# TEMPORARY, remove once the question is answered: does any scheduled run start in this repository?
# No `schedule` event has ever started here (five workflows have a cron on main), and nothing in
# those files explains it. This one has the shortest schedule GitHub allows and a job that only
# prints who the run is attributed to, so the answer comes within the hour instead of the next night.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
# The workflow reads nothing and changes nothing.
permissions: {}
jobs:
  schedule-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          CRON: ${{ github.event.schedule }}
        run: echo "event=$EVENT actor=$ACTOR triggering_actor=$TRIGGERING_ACTOR cron=$CRON"
