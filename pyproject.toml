[project]
name = "tickr"
version = "0.1.0"
description = "Single-owner intraday trading bot for US common stocks on Webull OpenAPI"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3", "ruff>=0.6"]
# Webull OpenAPI SDK, imported only by src/tickr/broker/webull.py.
webull = ["webull-openapi-python-sdk==3.0.3"]
# Anthropic SDK, imported only by src/tickr/advisor/client.py (the offline advisor, never the bot).
advisor = ["anthropic==2.8.0"]
# The trained model: LightGBM scoring and the shared feature code, imported only under
# src/tickr/model/. Versions are the training stack's pins (research boot scripts, 2026-11-25).
model = ["duckdb==2.0.0", "lightgbm==4.7.0", "numba==0.68.1", "numpy==2.5.3", "pandas==3.0.5",
         "websockets==15.0.1"]

[project.scripts]
tickr = "tickr.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Byte copies of the training's feature code, checked by md5 (tickr.model.features): never
# reformatted or edited here.
extend-exclude = ["src/tickr/model/features/pinned"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
