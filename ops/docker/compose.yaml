# Tickr on a Linux server (example). See docs/deploy-server.md before using it.
#
# ALERTS: the alert channel is Telegram. Put TICKR_TELEGRAM_BOT_TOKEN and TICKR_TELEGRAM_CHAT_ID
# in the env file; without them preflight refuses with `alert-channel-missing` and the bot job
# never starts the bot.
#
# On the server this file is the host copy /srv/tickr/etc/compose.yaml (deploy-server.sh refuses
# one that differs from the release image's /app/ops/docker/compose.yaml). Run with these host
# variables set (paths only, no values):
#   TICKR_ENV_FILE_HOST  absolute path of the env file (chmod 600, owned by the image's uid)
#   TICKR_CONFIG_HOST    absolute path of the bot.toml to run with
# and render-systemd's limits.env loaded (TICKR_IMAGE, TICKR_DATA_HOST, the host data folder,
# and the bot's grace period): set -a; . /srv/tickr/etc/limits.env; set +a
#
# The image is never built or pulled here. On the server TICKR_IMAGE is the release image
# <registry>/tickr-bot:<commit>, pulled beforehand by the host helper `tickr-image-pull <commit>`
# and written into limits.env by deploy-server.sh. Anywhere else, build an image yourself and
# name it in TICKR_IMAGE (docs/deploy-server.md, "An image built by hand").
#
# Jobs, matching the launchd jobs on the Mac (docs/operations.md, "Jobs"):
#   api        always on, restarted by Docker (launchd KeepAlive)      -> `up -d api`
#   preflight  scheduled by the host, never restarted                   -> `run --rm preflight`
#   bot        scheduled by the host, never restarted (crash = alert)   -> `up -d bot`
#   watchdog   scheduled by the host, separate from the bot, never restarted -> `up -d watchdog`
# The host scheduler (systemd timers, see the doc) starts them at the [runtime] times.

# Project name: the host units (tickr-bot-restart.service passes -p tickr) and a person typing
# compose commands act on the same containers, whatever folder compose runs from.
name: tickr

x-tickr: &tickr
  image: ${TICKR_IMAGE:?image to run; on the server deploy-server.sh writes it into limits.env}
  # Only an image already on the host runs: compose never pulls (and has nothing to build).
  pull_policy: never
  # Host networking: the API's loopback bind (127.0.0.1, enforced by the API itself) is the
  # server's loopback, never a public interface; Docker publishes no ports.
  network_mode: host
  # tini as PID 1: forwards SIGTERM to the supervisor and reaps children.
  init: true
  volumes:
    - type: bind
      source: ${TICKR_CONFIG_HOST:?absolute path of bot.toml}
      target: /app/config/bot.toml
      read_only: true
    # The data folder ([run] data_dir): the host folder TICKR_DATA_HOST (the server's data disk,
    # /srv/tickr/data), written by render-systemd into limits.env. A host folder, not a Docker
    # volume, so host units (tickr-bot-restart.path) see the same files as the containers.
    - type: bind
      source: ${TICKR_DATA_HOST:?run render-systemd and load its limits.env}
      target: /app/data
  logging:
    driver: json-file
    options:
      max-size: "50m"   # rotate each job's log at 50 MB
      max-file: "10"    # keep 10 rotated files per container

# Jobs that need credentials: the env file is mounted read-only and loaded by the entrypoint
# with `set -a; . file`, so its values never appear in `docker inspect` or in the image.
x-with-env: &with-env
  environment:
    TICKR_ENV_FILE: /run/tickr/env
  volumes:
    - type: bind
      source: ${TICKR_CONFIG_HOST:?absolute path of bot.toml}
      target: /app/config/bot.toml
      read_only: true
    - type: bind
      source: ${TICKR_ENV_FILE_HOST:?absolute path of the env file}
      target: /run/tickr/env
      read_only: true
    # The data folder ([run] data_dir): the host folder TICKR_DATA_HOST (the server's data disk,
    # /srv/tickr/data), written by render-systemd into limits.env. A host folder, not a Docker
    # volume, so host units (tickr-bot-restart.path) see the same files as the containers.
    - type: bind
      source: ${TICKR_DATA_HOST:?run render-systemd and load its limits.env}
      target: /app/data
    # Production only: the owner authorization file read by trading_gate(), for example
    # ([environments.production] authorization_file = "authorization/production.toml"):
    # - type: bind
    #   source: /absolute/path/to/authorization
    #   target: /app/authorization
    #   read_only: true

services:
  api:
    <<: *tickr
    command: ["python", "-m", "tickr.api", "--config", "/app/config/bot.toml"]
    restart: unless-stopped

  preflight:
    <<: [*with-env, *tickr]
    profiles: ["jobs"]
    command: ["python", "-m", "tickr.runtime", "--config", "/app/config/bot.toml",
              "preflight"]
    restart: "no"

  bot:
    <<: [*with-env, *tickr]
    profiles: ["jobs"]
    command: ["python", "-m", "tickr.runtime", "--config", "/app/config/bot.toml",
              "run-bot", "--", "python", "-m", "tickr.cli", "--config",
              "/app/config/bot.toml", "run"]
    # Never relaunched automatically (launchd KeepAlive false): a crash alerts instead.
    restart: "no"
    # Seconds between SIGTERM and SIGKILL on `docker compose stop bot` = [runtime]
    # bot_exit_timeout_seconds in bot.toml (launchd ExitTimeOut on the Mac). Never typed here:
    # `render-systemd` writes TICKR_BOT_EXIT_TIMEOUT into limits.env (units read it; for a
    # hand-run compose command: set -a; . /srv/tickr/etc/limits.env; set +a).
    stop_grace_period: ${TICKR_BOT_EXIT_TIMEOUT:?run render-systemd and load its limits.env}s
    # Host PID namespace: the pid the bot writes to its lock file is a pid the watchdog (another
    # container) can check. Without it the watchdog always sees "no live pid".
    pid: host

  watchdog:
    <<: [*with-env, *tickr]
    profiles: ["jobs"]
    command: ["python", "-m", "tickr.runtime", "--config", "/app/config/bot.toml",
              "watchdog"]
    restart: "no"
    pid: host

  # Nightly backtest data (python -m tickr.backtest nightly, docs/backtest.md): reads market data
  # only, never trades. The output and seed folders are [runtime] nightly_fetch_out and
  # nightly_fetch_seed, relative to the repo root (/app); render-systemd writes them into
  # limits.env as TICKR_NIGHTLY_OUT and TICKR_NIGHTLY_SEED. The container starts in /app/data.
  nightly-fetch:
    <<: [*with-env, *tickr]
    profiles: ["jobs"]
    command: ["python", "-m", "tickr.backtest", "--config", "/app/config/bot.toml", "nightly",
              "--out", "/app/${TICKR_NIGHTLY_OUT:?run render-systemd and load its limits.env}",
              "--seed", "/app/${TICKR_NIGHTLY_SEED:?run render-systemd and load its limits.env}"]
    restart: "no"
